<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الصليب المقدس - مهرجان الكرازة 2026</title>
    <style>
        /* التنسيقات الأساسية */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.5s;
            overflow-x: hidden;
        }

        /* شاشة التحذير الخفيف (الإجابة الخاطئة) */
        body.warning {
            background: linear-gradient(135deg, #ffe6e6 0%, #ffcccc 100%);
        }

        /* حاوية اللعبة */
        #game-container {
            background: white;
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
            text-align: center;
            border: 4px solid #4a90e2;
        }

        /* شاشة البداية والنهاية */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        p.subtitle {
            color: #7f8c8d;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        /* الأزرار الرئيسية */
        .btn-main {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-main:hover {
            transform: scale(1.05);
            background-color: #357abd;
        }

        /* شريط التقدم */
        #progress-ribbon {
            background-color: #f1c40f;
            color: #2c3e50;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* مستوى الصعوبة */
        .difficulty-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            color: white;
            font-size: 0.9em;
            margin-right: 15px;
            font-weight: bold;
        }
        .diff-easy { background-color: #2ecc71; }
        .diff-medium { background-color: #f39c12; }
        .diff-hard { background-color: #e74c3c; }

        /* منطقة السؤال */
        #question-text {
            font-size: 1.8em;
            color: #34495e;
            margin: 20px 0 30px;
            line-height: 1.4;
            font-weight: bold;
        }

        /* خيارات الإجابة */
        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 600px) {
            #options-container {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 20px;
            font-size: 1.3em;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            color: #2c3e50;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:hover {
            background-color: #e0e6ed;
            border-color: #3498db;
            transform: translateY(-3px);
        }

        .option-btn.correct {
            background-color: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.6);
            transform: scale(1.05);
        }

        .option-btn.wrong {
            background-color: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* تأثير النجوم الساطعة */
        .star {
            position: absolute;
            font-size: 2em;
            pointer-events: none;
            animation: flyStar 1s ease-out forwards;
            z-index: 10;
        }

        @keyframes flyStar {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(2); }
        }

        /* النتيجة النهائية */
        .result-icon {
            font-size: 5em;
            margin-bottom: 10px;
        }
        #final-score {
            font-size: 2.5em;
            color: #d35400;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

            </p>
            <button class="btn-main" onclick="startGame()">▶️ ابدأ اللعب الآن</button>

        let currentQuestionIndex = 0;
        let score = 0;
        let firstAttempt = true;

        // دالة بدء اللعبة
        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        // دالة تحميل السؤال
        function loadQuestion() {
            firstAttempt = true;
            const q = questions[currentQuestionIndex];
            
            // تحديث الشريط والصعوبة
            document.getElementById('progress-ribbon').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            
            const badge = document.getElementById('difficulty-badge');
            badge.innerText = q.difficulty;
            badge.className = `difficulty-badge ${q.diffClass}`;

            // نص السؤال
            document.getElementById('question-text').innerText = q.q;

            // توليد الأزرار
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            // تعديل تصميم أزرار (صح/خطأ) لتكون بجوار بعضها
            if (q.options.length === 2) {
                optionsContainer.style.gridTemplateColumns = '1fr 1fr';
            } else {
                optionsContainer.style.gridTemplateColumns = window.innerWidth > 600 ? '1fr 1fr' : '1fr';
            }
        }

        // دالة فحص الإجابة
        function checkAnswer(selectedIndex, button) {
            const q = questions[currentQuestionIndex];
            
            if (selectedIndex === q.answer) {
                // إجابة صحيحة
                button.classList.add('correct');
                
                // منع النقر على باقي الأزرار
                const allButtons = document.querySelectorAll('.option-btn');
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');

                if (firstAttempt) score++;
                
                showStarsEffect(button);
                document.body.classList.remove('warning');

                // الانتقال للسؤال التالي بعد تأخير
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        loadQuestion();
                    } else {
                        showResult();
                    }
                }, 1500);

            } else {
                // إجابة خاطئة
                firstAttempt = false;
                button.classList.add('wrong');
                button.style.pointerEvents = 'none'; // منع النقر على نفس الزر مرة أخرى
                
                // تأثير التحذير البصري (إضاءة حمراء خفيفة)
                document.body.classList.add('warning');
                setTimeout(() => document.body.classList.remove('warning'), 500);
            }
        }

        // تأثير النجوم المتطايرة
        function showStarsEffect(button) {
            const rect = button.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerText = '✨';
                star.style.left = x + 'px';
                star.style.top = y + 'px';
                
                // اتجاهات عشوائية للنجوم
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 50;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                document.body.appendChild(star);
                
                // إزالة النجمة بعد انتهاء الحركة
                setTimeout(() => star.remove(), 1000);
            }
        }

        // عرض النتيجة النهائية
        function showResult() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            document.getElementById('final-score').innerText = `النتيجة: ${score} من ${questions.length}`;
            
            let message = "";
            let emoji = "";
            
            if (score === questions.length) {
                message = "ممتاز جداً! أنت ملم بكل تفاصيل الدرس وتاريخ الصليب المقدس.";
                emoji = "👑";
            } else if (score >= 20) {
                message = "رائع! أداء جميل جداً ومجهود مقدر، استمر في دراستك.";
                emoji = "🌟";
            } else {
                message = "محاولة جيدة! نرجو مراجعة الدرس مرة أخرى لتعميق فهمك لرموز ونبوات الصليب.";
                emoji = "📖";
            }
            
            document.getElementById('result-message').innerText = message;
            document.getElementById('result-emoji').innerText = emoji;
        }

        // إعادة ضبط اللعبة
        function resetGame() {
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        }
    </script>
</body>
</html>
