<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cross Adventure Game</title>
<style>
    :root {
        --primary: #2196F3;
        --secondary: #FFC107;
        --bg: #E3F2FD;
        --correct: #4CAF50;
        --wrong: #F44336;
        --text: #333333;
    }

    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    #ribbon {
        width: 100%;
        background-color: var(--primary);
        color: white;
        padding: 15px 30px;
        font-size: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        position: sticky;
        top: 0;
        z-index: 100;
        font-weight: bold;
    }

    #music-controls {
        cursor: pointer;
        background: var(--secondary);
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 18px;
        font-weight: bold;
        color: var(--text);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }

    #music-controls:hover {
        transform: scale(1.05);
    }

    #game-container, #result-screen {
        background: white;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        padding: 40px;
        margin: 40px 20px;
        max-width: 800px;
        width: 90%;
        text-align: center;
        position: relative;
    }

    .warning {
        animation: flashRed 0.6s ease-in-out 2;
    }

    @keyframes flashRed {
        0% { box-shadow: 0 0 0px var(--wrong); }
        50% { box-shadow: 0 0 30px var(--wrong); }
        100% { box-shadow: 0 0 0px var(--wrong); }
    }

    #illustration {
        font-size: 90px;
        margin: 10px 0 20px 0;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    #question-text {
        font-size: 28px;
        margin-bottom: 40px;
        color: var(--primary);
        font-weight: bold;
        line-height: 1.4;
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .option-btn {
        background-color: #F5F5F5;
        border: 4px solid var(--primary);
        border-radius: 15px;
        padding: 20px;
        font-size: 22px;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
        font-family: inherit;
        color: var(--text);
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .option-btn:hover {
        transform: translateY(-5px);
        background-color: #E3F2FD;
    }

    .option-btn.correct {
        background-color: var(--correct) !important;
        color: white;
        border-color: var(--correct);
        box-shadow: 0 0 15px var(--correct);
    }

    .option-btn.wrong {
        background-color: var(--wrong) !important;
        color: white;
        border-color: var(--wrong);
        animation: shake 0.4s;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    .star {
        position: fixed;
        font-size: 40px;
        animation: flyUp 1s ease-out forwards;
        pointer-events: none;
        z-index: 1000;
    }

    @keyframes flyUp {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(180deg); opacity: 0; }
    }

    #result-screen {
        display: none;
    }

    #result-title {
        font-size: 48px;
        color: var(--primary);
        margin-bottom: 20px;
    }

    #result-text {
        font-size: 32px;
        color: var(--correct);
        margin-bottom: 40px;
    }

    #retake-btn {
        background-color: var(--secondary);
        border: none;
        padding: 20px 50px;
        font-size: 26px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 6px 10px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }

    #retake-btn:hover {
        transform: scale(1.1);
    }

    @media(max-width: 768px) {
        .options-grid {
            grid-template-columns: 1fr;
        }
        #ribbon {
            flex-direction: column;
            gap: 10px;
            font-size: 20px;
        }
        #question-text {
            font-size: 24px;
        }
    }
</style>
</head>
<body>

<div id="ribbon">
    <div>⚓ The Cross Adventure Game</div>
    <div id="progress-text">Question 1 of 30</div>
    <button id="music-controls" onclick="toggleMusic()">🎵 Play Music</button>
</div>

<div id="game-container">
    <div id="illustration"></div>
    <div id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
</div>

<div id="result-screen">
    <div id="result-title">🎉 Adventure Complete! 🎉</div>
    <div id="result-text"></div>
    <button id="retake-btn" onclick="retake()">Play Again! 🔄</button>
</div>

<script>
    // --- Audio Synthesizer ---
    let audioCtx;
    let isPlaying = false;
    let loopId;

    function playTone(freq, time, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.08, time + 0.05);
        gain.gain.linearRampToValueAtTime(0, time + duration);
        osc.start(time);
        osc.stop(time + duration);
    }

    function playMelody() {
        if (!isPlaying) return;
        const now = audioCtx.currentTime;
        const melody = [
            { f: 392.00, t: 0.0, d: 0.2 }, 
            { f: 523.25, t: 0.2, d: 0.2 }, 
            { f: 659.25, t: 0.4, d: 0.2 }, 
            { f: 783.99, t: 0.6, d: 0.4 }, 
            { f: 659.25, t: 1.2, d: 0.2 }, 
            { f: 783.99, t: 1.4, d: 0.6 }  
        ];
        
        melody.forEach(note => playTone(note.f, now + note.t, note.d));
        loopId = setTimeout(playMelody, 3000); 
    }

    function toggleMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const btn = document.getElementById('music-controls');
        if (isPlaying) {
            isPlaying = false;
            clearTimeout(loopId);
            btn.innerHTML = '🎵 Play Music';
        } else {
            isPlaying = true;
            audioCtx.resume();
            playMelody();
            btn.innerHTML = '⏸️ Stop Music';
        }
    }

    // --- Game Logic & Data ---
    const questions = [
        { q: "Who is leading the team of friends in the adventure?", o: ["Uncle Mark", "Moses", "Saint Anthony", "Saint John"], a: 0, ill: "👨‍🏫" },
        { q: "What is the theme verse for Mahragan El Keraza 2026?", o: ["Romans 8:37", "Genesis 1:27", "John 3:16", "Romans 5:12"], a: 0, ill: "📖" },
        { q: "How many friends are on the adventure team?", o: ["Two", "Three", "Four", "Five"], a: 2, ill: "👦👧👦👧" },
        { q: "True or False: Swimming across the river was permitted in the game rules.", o: ["True", "False"], a: 1, ill: "🏊‍♂️" },
        { q: "What was the problem with the willow tree?", o: ["It absorbs water and could sink", "It was too hard to cut", "It was too small", "It did not shine"], a: 0, ill: "🌳" },
        { q: "What kind of wood did Uncle Mark say they needed to build their boat?", o: ["Willow or Pine", "Oak or Mahogany", "Cedar or Ash", "Iron or Steel"], a: 1, ill: "🪵" },
        { q: "True or False: The wood of the cross always expresses survival.", o: ["True", "False"], a: 0, ill: "✝️" },
        { q: "What is the only creature God breathed the breath of life into?", o: ["Animals", "Angels", "Man", "Birds"], a: 2, ill: "👤" },
        { q: "What was the punishment for eating from the tree of the knowledge of good and evil?", o: ["Death", "Sickness", "Banishment only", "Hard work"], a: 0, ill: "🍎" },
        { q: "True or False: Adam and Eve obeyed God's command about the tree.", o: ["True", "False"], a: 1, ill: "🐍" },
        { q: "Because of sin, what happened to human nature?", o: ["It became stronger", "It was corrupted", "It became immortal", "It didn't change"], a: 1, ill: "🥀" },
        { q: "Who lifted the sentence of death from us?", o: ["Moses", "Adam", "The Lord Jesus", "Saint Anthony"], a: 2, ill: "👑" },
        { q: "How did the Lord Jesus renew our corrupted nature?", o: ["By his teaching", "By his miracles", "By his resurrection", "By his fasting"], a: 2, ill: "🌅" },
        { q: "Which of these is a Sacrament we need to receive to benefit from salvation?", o: ["Baptism", "Washing", "Offering", "Singing"], a: 0, ill: "💧" },
        { q: "Who led the people of Israel out of the land of Egypt?", o: ["Aaron", "Joshua", "Moses", "Abraham"], a: 2, ill: "🚶‍♂️" },
        { q: "What did God send from heaven when the people asked for food?", o: ["Apples and Oranges", "Manna and Quail", "Bread and Fish", "Milk and Honey"], a: 1, ill: "🍞🐦" },
        { q: "True or False: The people of Israel trusted God perfectly and never grumbled.", o: ["True", "False"], a: 1, ill: "😠" },
        { q: "What happened when the people grumbled against God in the wilderness?", o: ["It rained heavily", "Fiery serpents bit them", "The earth shook", "They lost their way"], a: 1, ill: "🐍🔥" },
        { q: "What did Moses make to save the people from the serpents?", o: ["A bronze shield", "A wooden raft", "A bronze serpent", "A golden calf"], a: 2, ill: "🐍✨" },
        { q: "True or False: The bronze serpent had the same venom as the real serpents.", o: ["True", "False"], a: 1, ill: "⚕️" },
        { q: "What did a person have to do to be saved from the serpent's bite?", o: ["Hide in a tent", "Look at the bronze serpent", "Drink water from the rock", "Run away"], a: 1, ill: "👀" },
        { q: "Why didn't the Lord Jesus die of sickness or old age?", o: ["Because he had to be a sacrifice for our sins", "Because people loved him", "Because he was too strong", "Because he hid from his enemies"], a: 0, ill: "🐑" },
        { q: "Why did Jesus want His body to stay whole, without broken bones?", o: ["Because it represents the united Church", "Because he was careful", "Because the soldiers forgot", "Because it was the law"], a: 0, ill: "⛪" },
        { q: "What does the sign of the cross point to?", o: ["The sky and the earth", "The four corners of the world", "The past and future", "The sun and moon"], a: 1, ill: "🌍" },
        { q: "True or False: We die with Jesus in Golgotha during the Sacrament of Baptism.", o: ["True", "False"], a: 1, ill: "💧" },
        { q: "The verse says, \"Cursed is everyone who hangs on a...\"", o: ["Rope", "Mountain", "Tree", "Building"], a: 2, ill: "🌳" },
        { q: "True or False: God chose the cross to show how much He hates sin and loves us.", o: ["True", "False"], a: 0, ill: "❤️" },
        { q: "After the Resurrection, what confirmed that Jesus was the same person who died?", o: ["His clothes", "The marks of the nails", "His hair", "His voice only"], a: 1, ill: "✋" },
        { q: "The cross was transformed from a sign of shame into a sign of...", o: ["Sadness", "Victory and pride", "Defeat", "Anger"], a: 1, ill: "🏆" },
        { q: "What did the friends finally build to cross the river safely?", o: ["A wooden raft", "An airplane", "A bridge", "A submarine"], a: 0, ill: "🛶" }
    ];

    let currentQ = 0;
    let score = 0;
    let firstTry = true;

    function shootStars(btn) {
        const rect = btn.getBoundingClientRect();
        const emojis = ['⭐', '✨', '🌟'];
        for(let i=0; i<15; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            star.style.left = (rect.left + rect.width/2) + 'px';
            star.style.top = (rect.top + rect.height/2) + 'px';
            
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.random() * 120 + 60;
            let tx = Math.cos(angle) * distance;
            let ty = Math.sin(angle) * distance - 100; 
            
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    function loadQuestion() {
        firstTry = true;
        const q = questions[currentQ];
        document.getElementById('progress-text').innerText = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById('illustration').innerText = q.ill;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        q.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(index, btn) {
        if(btn.classList.contains('wrong') || btn.classList.contains('correct')) return;

        const q = questions[currentQ];
        const buttons = document.querySelectorAll('.option-btn');
        const container = document.getElementById('game-container');
        
        if (index === q.a) {
            btn.classList.add('correct');
            shootStars(btn);
            if (firstTry) score++;
            
            buttons.forEach(b => b.style.pointerEvents = 'none');
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        } else {
            btn.classList.add('wrong');
            firstTry = false;
            
            container.classList.remove('warning');
            void container.offsetWidth; 
            container.classList.add('warning');
        }
    }

    function showResult() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('result-text').innerText = `You scored ${score} out of ${questions.length} on your first try!\n\nThat's ${percent}%!`;
    }

    function retake() {
        currentQ = 0;
        score = 0;
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        loadQuestion();
    }

    // Initialize Game
    loadQuestion();
</script>
</body>
</html>
