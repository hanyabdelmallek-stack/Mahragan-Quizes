<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cross Adventure: Procession of the Feast</title>
<style>
    :root {
        --primary: #FF5722;
        --secondary: #FFC107;
        --bg: #FFF3E0;
        --correct: #4CAF50;
        --wrong: #F44336;
        --text: #333333;
    }

    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    #ribbon {
        width: 100%;
        background-color: var(--primary);
        color: white;
        padding: 15px 30px;
        font-size: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        position: sticky;
        top: 0;
        z-index: 100;
        font-weight: bold;
    }

    #music-controls {
        cursor: pointer;
        background: var(--secondary);
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 18px;
        font-weight: bold;
        color: var(--text);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }

    #music-controls:hover {
        transform: scale(1.05);
    }

    #game-container, #result-screen {
        background: white;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        padding: 40px;
        margin: 40px 20px;
        max-width: 800px;
        width: 90%;
        text-align: center;
        position: relative;
    }

    .warning {
        animation: flashRed 0.6s ease-in-out 2;
    }

    @keyframes flashRed {
        0% { box-shadow: 0 0 0px var(--wrong); }
        50% { box-shadow: 0 0 30px var(--wrong); }
        100% { box-shadow: 0 0 0px var(--wrong); }
    }

    #illustration {
        font-size: 90px;
        margin: 10px 0 20px 0;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    #question-text {
        font-size: 28px;
        margin-bottom: 40px;
        color: var(--primary);
        font-weight: bold;
        line-height: 1.4;
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .option-btn {
        background-color: #F5F5F5;
        border: 4px solid var(--primary);
        border-radius: 15px;
        padding: 20px;
        font-size: 22px;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
        font-family: inherit;
        color: var(--text);
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .option-btn:hover {
        transform: translateY(-5px);
        background-color: #FFF3E0;
    }

    .option-btn.correct {
        background-color: var(--correct) !important;
        color: white;
        border-color: var(--correct);
        box-shadow: 0 0 15px var(--correct);
    }

    .option-btn.wrong {
        background-color: var(--wrong) !important;
        color: white;
        border-color: var(--wrong);
        animation: shake 0.4s;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    .star {
        position: fixed;
        font-size: 40px;
        animation: flyUp 1s ease-out forwards;
        pointer-events: none;
        z-index: 1000;
    }

    @keyframes flyUp {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(180deg); opacity: 0; }
    }

    #result-screen {
        display: none;
    }

    #result-title {
        font-size: 48px;
        color: var(--primary);
        margin-bottom: 20px;
    }

    #result-text {
        font-size: 32px;
        color: var(--correct);
        margin-bottom: 40px;
    }

    #retake-btn {
        background-color: var(--secondary);
        border: none;
        padding: 20px 50px;
        font-size: 26px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 6px 10px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }

    #retake-btn:hover {
        transform: scale(1.1);
    }

    @media(max-width: 768px) {
        .options-grid {
            grid-template-columns: 1fr;
        }
        #ribbon {
            flex-direction: column;
            gap: 10px;
            font-size: 20px;
        }
        #question-text {
            font-size: 24px;
        }
    }
</style>
</head>
<body>

<div id="ribbon">
    <div>⛪ The Church Procession Adventure</div>
    <div id="progress-text">Question 1 of 30</div>
    <button id="music-controls" onclick="toggleMusic()">🎵 Play Music</button>
</div>

<div id="game-container">
    <div id="illustration"></div>
    <div id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
</div>

<div id="result-screen">
    <div id="result-title">🎉 Great Job, Explorer! 🎉</div>
    <div id="result-text"></div>
    <button id="retake-btn" onclick="retake()">Play Again! 🔄</button>
</div>

<script>
    // --- Audio Synthesizer ---
    let audioCtx;
    let isPlaying = false;
    let loopId;

    function playTone(freq, time, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.05, time + 0.05);
        gain.gain.linearRampToValueAtTime(0, time + duration);
        osc.start(time);
        osc.stop(time + duration);
    }

    function playMelody() {
        if (!isPlaying) return;
        const now = audioCtx.currentTime;
        // Cheerful, joyful tune
        const melody = [
            { f: 523.25, t: 0.0, d: 0.2 }, 
            { f: 659.25, t: 0.2, d: 0.2 }, 
            { f: 783.99, t: 0.4, d: 0.4 }, 
            { f: 659.25, t: 0.8, d: 0.2 }, 
            { f: 1046.50, t: 1.0, d: 0.6 }  
        ];
        
        melody.forEach(note => playTone(note.f, now + note.t, note.d));
        loopId = setTimeout(playMelody, 2000); 
    }

    function toggleMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const btn = document.getElementById('music-controls');
        if (isPlaying) {
            isPlaying = false;
            clearTimeout(loopId);
            btn.innerHTML = '🎵 Play Music';
        } else {
            isPlaying = true;
            audioCtx.resume();
            playMelody();
            btn.innerHTML = '⏸️ Stop Music';
        }
    }

    // --- Game Logic & Data ---
    const questions = [
        { q: "What happened to the raft when Tony stopped following the map?", o: ["It sank", "It started spinning in a whirlpool", "It flew into the sky", "It turned into a boat"], a: 1, ill: "🛶" },
        { q: "Why did Tony stop following the map and route instructions?", o: ["He lost the map", "He couldn't read", "He thought they were moving with the current", "He fell asleep"], a: 2, ill: "🗺️" },
        { q: "Because God is not the author of confusion but of order, the system and order in the Church is called...", o: ["A Game", "A Puzzle", "A Rite (Tags)", "A Map"], a: 2, ill: "📖" },
        { q: "What is the Coptic word for the Celebratory Processions?", o: ["Zafa", "Lagan", "Alhan", "Daf"], a: 0, ill: "🚶‍♂️🚶‍♀️" },
        { q: "What instruments do the deacons use to praise during the procession?", o: ["Guitar and Drums", "Cymbals (Daf) and Triangle (Tarianto)", "Piano and Flute", "Violin and Cello"], a: 1, ill: "🎶" },
        { q: "How many stations are in the Procession of the Feast of the Cross?", o: ["3 stations", "7 stations", "10 stations", "12 stations"], a: 3, ill: "📍" },
        { q: "True or False: The procession for Palm Sunday has the SAME rite as the feasts of the Cross.", o: ["True", "False"], a: 0, ill: "🌿" },
        { q: "During the two Feasts of the Cross, what is the cross decorated with?", o: ["Jewels", "Flowers", "Gold coins", "Ribbons"], a: 1, ill: "🌸" },
        { q: "What is ADDED to the cross decorations for Palm Sunday?", o: ["Apples and Oranges", "Silver bells", "Olive branches and palm leaves", "Feathers"], a: 2, ill: "🌿" },
        { q: "What does Abouna hold in his hand during the procession?", o: ["A map", "The censer", "A candle only", "A wooden staff"], a: 1, ill: "💨" },
        { q: "What does the Main Sanctuary in the church symbolize?", o: ["The Ocean", "A Garden", "Heaven", "A Castle"], a: 2, ill: "☁️" },
        { q: "According to the Gospel Response at the First Station, what do the four living creatures carry?", o: ["The throne of God", "A golden crown", "A large boat", "The sun and moon"], a: 0, ill: "👑" },
        { q: "What does the word \"Hosanna\" mean?", o: ["Good morning", "Save us", "Thank you", "Peace be with you"], a: 1, ill: "🙏" },
        { q: "Which Archangel announced to Saint Mary that she would give birth to the Lord Jesus?", o: ["Archangel Michael", "Archangel Raphael", "Archangel Gabriel", "Archangel Suriel"], a: 2, ill: "👼" },
        { q: "Which Archangel rolled away the stone from the tomb and is called \"the Angel of the Resurrection\"?", o: ["Archangel Michael", "Archangel Gabriel", "Archangel Zadkiel", "Archangel Uriel"], a: 0, ill: "🪨" },
        { q: "Who is known as the Evangelist of Egypt?", o: ["Saint Peter", "Saint Mark", "Saint Paul", "Saint Thomas"], a: 1, ill: "🦁" },
        { q: "The Lord Jesus chose Saint Mark as one of how many apostles to send to the ministry?", o: ["12", "40", "70", "100"], a: 2, ill: "👥" },
        { q: "True or False: The Lord gave the Twelve Disciples authority to heal the sick and cast out demons.", o: ["True", "False"], a: 0, ill: "✨" },
        { q: "Which saint completed seven whole years being judged daily by seventy lawless kings?", o: ["Saint Anthony", "Saint Mark", "Saint George", "Saint Moses"], a: 2, ill: "🛡️" },
        { q: "Who left everything in the world, carried the cross of ascetic life, and became the father of all monks?", o: ["Saint Anthony", "Saint George", "Saint John", "Saint Peter"], a: 0, ill: "⛰️" },
        { q: "Which door is the 9th station located at?", o: ["The Southern Door", "The Northern Door", "The Western Door", "The Eastern Door"], a: 1, ill: "🚪" },
        { q: "What does the Lagan Basin at the Western Door remind us of?", o: ["The washing of the disciples' feet on Covenant Thursday", "The feeding of the 5000", "The fiery furnace", "Noah's Ark"], a: 0, ill: "💧" },
        { q: "In Baptism, we move from darkness to light. Which directions represent darkness and light?", o: ["North to South", "South to North", "West to East", "East to West"], a: 2, ill: "🌅" },
        { q: "At the Southern Door (11th Station), which Gospel event do we read about?", o: ["The Birth of Jesus", "The Lord Jesus entering Jerusalem on Palm Sunday", "The Resurrection", "The Ascension"], a: 1, ill: "🌿" },
        { q: "Who prophesied about the crucifixion by saying, \"Behold! The Lamb of God who takes away the sin of the world!\"?", o: ["Saint Mark", "Saint George", "Saint John the Baptist", "Saint Anthony"], a: 2, ill: "🐑" },
        { q: "What did Saint John the Baptist receive at the hands of the evil King Herod?", o: ["A golden shield", "The crown of martyrdom", "A new house", "A big boat"], a: 1, ill: "👑" },
        { q: "The two feasts of the Cross are celebrated on 10 Baramhat and what other Coptic date?", o: ["1 Tout", "17 Tout", "29 Kiahk", "15 Hatour"], a: 1, ill: "📅" },
        { q: "Why is the Church organized in all its prayers and everything in it?", o: ["To look pretty", "Because God is the author of system and order", "To make it complicated", "To finish quickly"], a: 1, ill: "⛪" },
        { q: "True or False: Every Psalm and Gospel read at the 12 stations has a clear connection to the Cross.", o: ["True", "False"], a: 0, ill: "✝️" },
        { q: "When the congregation participates in the procession, what do they sing?", o: ["Pop songs", "The most beautiful hymns (Alhan)", "Lullabies", "Campfire songs"], a: 1, ill: "🎤" }
    ];

    let currentQ = 0;
    let score = 0;
    let firstTry = true;

    function shootStars(btn) {
        const rect = btn.getBoundingClientRect();
        const emojis = ['⭐', '✨', '🌟', '🎉'];
        for(let i=0; i<15; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            star.style.left = (rect.left + rect.width/2) + 'px';
            star.style.top = (rect.top + rect.height/2) + 'px';
            
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.random() * 120 + 60;
            let tx = Math.cos(angle) * distance;
            let ty = Math.sin(angle) * distance - 100; 
            
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    function loadQuestion() {
        firstTry = true;
        const q = questions[currentQ];
        document.getElementById('progress-text').innerText = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById('illustration').innerText = q.ill;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        q.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(index, btn) {
        if(btn.classList.contains('wrong') || btn.classList.contains('correct')) return;

        const q = questions[currentQ];
        const buttons = document.querySelectorAll('.option-btn');
        const container = document.getElementById('game-container');
        
        if (index === q.a) {
            btn.classList.add('correct');
            shootStars(btn);
            if (firstTry) score++;
            
            buttons.forEach(b => b.style.pointerEvents = 'none');
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        } else {
            btn.classList.add('wrong');
            firstTry = false;
            
            container.classList.remove('warning');
            void container.offsetWidth; 
            container.classList.add('warning');
        }
    }

    function showResult() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('result-text').innerText = `Wonderful!\nYou scored ${score} out of ${questions.length} on your first try!\n\nThat's ${percent}%! You learned so much about the Procession!`;
    }

    function retake() {
        currentQ = 0;
        score = 0;
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        loadQuestion();
    }

    // Initialize Game
    loadQuestion();
</script>
</body>
</html>
