<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3_Lydia_St. Anthony_Quiz 2</title>
<style>
    :root {
        --primary: #673AB7; /* Deep Purple */
        --secondary: #FFC107; /* Amber/Gold */
        --bg: #EDE7F6; /* Light Purple Background */
        --correct: #4CAF50;
        --wrong: #F44336;
        --text: #212121;
    }

    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    #ribbon {
        width: 100%;
        background-color: var(--primary);
        color: white;
        padding: 15px 30px;
        font-size: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        position: sticky;
        top: 0;
        z-index: 100;
        font-weight: bold;
    }

    #music-controls {
        cursor: pointer;
        background: var(--secondary);
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 18px;
        font-weight: bold;
        color: #333;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }

    #music-controls:hover {
        transform: scale(1.05);
    }

    #game-container, #result-screen {
        background: white;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        padding: 40px;
        margin: 40px 20px;
        max-width: 800px;
        width: 90%;
        text-align: center;
        position: relative;
    }

    .warning {
        animation: flashRed 0.6s ease-in-out 2;
    }

    @keyframes flashRed {
        0% { box-shadow: 0 0 0px var(--wrong); }
        50% { box-shadow: 0 0 30px var(--wrong); }
        100% { box-shadow: 0 0 0px var(--wrong); }
    }

    #illustration {
        font-size: 90px;
        margin: 10px 0 20px 0;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    #question-text {
        font-size: 28px;
        margin-bottom: 40px;
        color: var(--primary);
        font-weight: bold;
        line-height: 1.4;
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .option-btn {
        background-color: #F5F5F5;
        border: 4px solid var(--primary);
        border-radius: 15px;
        padding: 20px;
        font-size: 22px;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
        font-family: inherit;
        color: var(--text);
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .option-btn:hover {
        transform: translateY(-5px);
        background-color: #EDE7F6;
    }

    .option-btn.correct {
        background-color: var(--correct) !important;
        color: white;
        border-color: var(--correct);
        box-shadow: 0 0 15px var(--correct);
    }

    .option-btn.wrong {
        background-color: var(--wrong) !important;
        color: white;
        border-color: var(--wrong);
        animation: shake 0.4s;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    .star {
        position: fixed;
        font-size: 40px;
        animation: flyUp 1s ease-out forwards;
        pointer-events: none;
        z-index: 1000;
    }

    @keyframes flyUp {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(180deg); opacity: 0; }
    }

    #result-screen {
        display: none;
    }

    #result-title {
        font-size: 48px;
        color: var(--primary);
        margin-bottom: 20px;
    }

    #result-text {
        font-size: 32px;
        color: var(--correct);
        margin-bottom: 40px;
    }

    #retake-btn {
        background-color: var(--secondary);
        color: #333;
        border: none;
        padding: 20px 50px;
        font-size: 26px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 6px 10px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }

    #retake-btn:hover {
        transform: scale(1.1);
    }

    @media(max-width: 768px) {
        .options-grid {
            grid-template-columns: 1fr;
        }
        #ribbon {
            flex-direction: column;
            gap: 10px;
            font-size: 20px;
            text-align: center;
        }
        #question-text {
            font-size: 24px;
        }
    }
</style>
</head>
<body>

<div id="ribbon">
    <div>🧭 3_Lydia_St. Anthony_Quiz 2</div>
    <div id="progress-text">Question 1 of 30</div>
    <button id="music-controls" onclick="toggleMusic()">🎵 Play Music</button>
</div>

<div id="game-container">
    <div id="illustration"></div>
    <div id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
</div>

<div id="result-screen">
    <div id="result-title">🌟 Outstanding! 🌟</div>
    <div id="result-text"></div>
    <button id="retake-btn" onclick="retake()">Play Again! 🔄</button>
</div>

<script>
    // --- Audio Synthesizer ---
    let audioCtx;
    let isPlaying = false;
    let loopId;

    function playTone(freq, time, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.08, time + 0.05);
        gain.gain.linearRampToValueAtTime(0, time + duration);
        osc.start(time);
        osc.stop(time + duration);
    }

    function playMelody() {
        if (!isPlaying) return;
        const now = audioCtx.currentTime;
        const melody = [
            { f: 523.25, t: 0.0, d: 0.3 }, 
            { f: 659.25, t: 0.3, d: 0.3 }, 
            { f: 783.99, t: 0.6, d: 0.3 }, 
            { f: 1046.50, t: 0.9, d: 0.6 }  
        ];
        
        melody.forEach(note => playTone(note.f, now + note.t, note.d));
        loopId = setTimeout(playMelody, 3000); 
    }

    function toggleMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const btn = document.getElementById('music-controls');
        if (isPlaying) {
            isPlaying = false;
            clearTimeout(loopId);
            btn.innerHTML = '🎵 Play Music';
        } else {
            isPlaying = true;
            audioCtx.resume();
            playMelody();
            btn.innerHTML = '⏸️ Stop Music';
        }
    }

    // --- Game Logic & Data ---
    const questions = [
        { q: "What did the group open to calculate the current so they could move in the correct direction?", o: ["A book", "The map", "A compass", "A letter"], a: 1, ill: "🗺️" },
        { q: "Who asked John to bring the communication device to send a signal to the game control room?", o: ["Lauren", "Marina", "Uncle Mark", "Tony"], a: 2, ill: "👨‍🏫" },
        { q: "Why did they need to send a signal to the game control room?", o: ["To ask for food", "So they could send them the next point", "To quit the game", "To talk to their parents"], a: 1, ill: "📡" },
        { q: "Who was really excited about the next task before they realized the device was lost?", o: ["Tony", "John", "Lauren", "Uncle Mark"], a: 0, ill: "😃" },
        { q: "What did John say right before telling everyone he dropped the device?", o: ["I see an island!", "I made a big mistake!", "I am hungry!", "Let's row faster!"], a: 1, ill: "😟" },
        { q: "Who calmed Tony down and told him 'We're on the raft. Calm down so we can think.'?", o: ["Marina", "Uncle Mark", "Lauren", "John"], a: 2, ill: "🧘‍♀️" },
        { q: "Where did Uncle Mark say he was going to look for the lost device?", o: ["To the end of the river", "Under the raft", "In the forest", "At the starting point"], a: 0, ill: "🌊" },
        { q: "What did Uncle Mark say is located at the end of the river?", o: ["A waterfall", "A small lake", "A large ocean", "A cave"], a: 1, ill: "🏞️" },
        { q: "What items did Tony tell Uncle Mark to take with him?", o: ["A flashlight and rope", "Water, food, and the life vest", "A map and compass", "A spear and net"], a: 1, ill: "🎒" },
        { q: "When did Uncle Mark finally return to the group?", o: ["At noon", "The next morning", "When night began to fall", "In an hour"], a: 2, ill: "🌙" },
        { q: "True or False: The communication device was destroyed because it wasn't waterproof.", o: ["True", "False"], a: 1, ill: "📱" },
        { q: "In the Synexarium, what date is Saint Anthony commemorated?", o: ["1 Tout", "10 Baramhat", "22 Toba", "29 Kiahk"], a: 2, ill: "📖" },
        { q: "What governorate is Saint Anthony's birth village, Qiman El-Arous, located in?", o: ["Cairo", "Beni Suef", "Alexandria", "Aswan"], a: 1, ill: "📍" },
        { q: "What did Saint Anthony's parents teach him and his sister to do?", o: ["Make a lot of money", "Love God with all their hearts", "Travel the world", "Become famous"], a: 1, ill: "❤️" },
        { q: "True or False: Saint Anthony's rich family loved the poor.", o: ["True", "False"], a: 0, ill: "🤝" },
        { q: "How old was Saint Anthony when his parents died?", o: ["About 10 years old", "About 15 years old", "About 18 years old", "About 25 years old"], a: 2, ill: "🎂" },
        { q: "True or False: Saint Anthony gave ALL his money to the poor and kept absolutely nothing.", o: ["True", "False, he kept a small portion for his sister"], a: 1, ill: "💰" },
        { q: "What virtue did Saint Anthony learn from one ascetic that was paired with humility?", o: ["Gentleness", "Courage", "Speed", "Loudness"], a: 0, ill: "🕊️" },
        { q: "What virtue did he learn from another ascetic that involved not speaking?", o: ["Silence", "Singing", "Preaching", "Storytelling"], a: 0, ill: "🤫" },
        { q: "What other virtues did Saint Anthony learn from the ascetics besides gentleness, humility, and silence?", o: ["Farming and fishing", "Constant prayer and watchfulness", "Building and painting", "Reading and writing"], a: 1, ill: "🙏" },
        { q: "Why did the woman come to the river near where Saint Anthony lived?", o: ["To wash clothes", "To catch fish", "To bathe", "To get a drink"], a: 2, ill: "💧" },
        { q: "Where did Saint Anthony go immediately after talking to the woman at the river?", o: ["Back to his village", "To the inner desert", "To Alexandria", "To a big city"], a: 1, ill: "🏜️" },
        { q: "What did the angel sent by God wear on his head to help Abba Anthony fight boredom?", o: ["A golden crown", "A hood with crosses", "A simple hat", "Nothing"], a: 1, ill: "👼" },
        { q: "What was the monastic eskim the angel wore made of?", o: ["A leather belt decorated with crosses", "A gold chain", "A simple rope", "A silk sash"], a: 0, ill: "✝️" },
        { q: "What did the angel's handiwork (weaving baskets) become for the monks?", o: ["A way to get rich", "One of the foundations of monastic life to fight boredom", "A game", "A decoration"], a: 1, ill: "🧺" },
        { q: "What does 'Bearers of the Cross' mean spiritually for the monks?", o: ["They wear heavy wooden crosses", "They take the Cross as a source of comfort, strength, and victory", "They hide the cross", "They paint crosses"], a: 1, ill: "🛡️" },
        { q: "When Saint Anthony went further into the inner desert, what did he find near his cave?", o: ["A gold mine", "A big river", "A water spring", "A forest"], a: 2, ill: "💦" },
        { q: "Who was the Emperor during Saint Anthony's first trip to Alexandria when there was great persecution?", o: ["Arius", "Maximian", "Nero", "Pharaoh"], a: 1, ill: "👑" },
        { q: "Who was the 20th Patriarch that Saint Anthony supported during his second trip to Alexandria?", o: ["Pope Shenouda", "Pope Kyrillos", "Pope Athanasius", "Pope Mark"], a: 2, ill: "⛪" },
        { q: "True or False: Saint Anthony was the very first person to live in the desert as a hermit.", o: ["True", "False, God guided him to Saint Abba Paul, the first hermit"], a: 1, ill: "🏜️" }
    ];

    let currentQ = 0;
    let score = 0;
    let firstTry = true;

    function shootStars(btn) {
        const rect = btn.getBoundingClientRect();
        const emojis = ['⭐', '✨', '🌟', '🎉'];
        for(let i=0; i<15; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            star.style.left = (rect.left + rect.width/2) + 'px';
            star.style.top = (rect.top + rect.height/2) + 'px';
            
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.random() * 120 + 60;
            let tx = Math.cos(angle) * distance;
            let ty = Math.sin(angle) * distance - 100; 
            
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    function loadQuestion() {
        firstTry = true;
        const q = questions[currentQ];
        document.getElementById('progress-text').innerText = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById('illustration').innerText = q.ill;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        q.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(index, btn) {
        if(btn.classList.contains('wrong') || btn.classList.contains('correct')) return;

        const q = questions[currentQ];
        const buttons = document.querySelectorAll('.option-btn');
        const container = document.getElementById('game-container');
        
        if (index === q.a) {
            btn.classList.add('correct');
            shootStars(btn);
            if (firstTry) score++;
            
            buttons.forEach(b => b.style.pointerEvents = 'none');
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        } else {
            btn.classList.add('wrong');
            firstTry = false;
            
            container.classList.remove('warning');
            void container.offsetWidth; 
            container.classList.add('warning');
        }
    }

    function showResult() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('result-text').innerText = `Super job!\nYou scored ${score} out of ${questions.length} on your first try!\n\nThat's ${percent}%! You are a quiz master!`;
    }

    function retake() {
        currentQ = 0;
        score = 0;
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        loadQuestion();
    }

    // Initialize Game
    loadQuestion();
</script>
</body>
</html>
