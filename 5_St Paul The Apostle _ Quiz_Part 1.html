<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5_St Paul The Apostle _ Quiz_Part 1</title>
<style>
    :root {
        --primary: #8E24AA; /* Deep Purple */
        --secondary: #FF9800; /* Vibrant Orange */
        --bg: #F3E5F5; /* Light Purple Background */
        --correct: #4CAF50;
        --wrong: #F44336;
        --text: #3E2723;
    }

    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    #ribbon {
        width: 100%;
        background-color: var(--primary);
        color: white;
        padding: 15px 30px;
        font-size: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        position: sticky;
        top: 0;
        z-index: 100;
        font-weight: bold;
    }

    #music-controls {
        cursor: pointer;
        background: var(--secondary);
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }

    #music-controls:hover {
        transform: scale(1.05);
    }

    #game-container, #result-screen {
        background: white;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        padding: 40px;
        margin: 40px 20px;
        max-width: 800px;
        width: 90%;
        text-align: center;
        position: relative;
    }

    .warning {
        animation: flashRed 0.6s ease-in-out 2;
    }

    @keyframes flashRed {
        0% { box-shadow: 0 0 0px var(--wrong); }
        50% { box-shadow: 0 0 30px var(--wrong); }
        100% { box-shadow: 0 0 0px var(--wrong); }
    }

    #illustration {
        font-size: 90px;
        margin: 10px 0 20px 0;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    #question-text {
        font-size: 24px;
        margin-bottom: 40px;
        color: var(--primary);
        font-weight: bold;
        line-height: 1.5;
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .option-btn {
        background-color: #F5F5F5;
        border: 4px solid var(--primary);
        border-radius: 15px;
        padding: 20px;
        font-size: 20px;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
        font-family: inherit;
        color: var(--text);
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .option-btn:hover {
        transform: translateY(-5px);
        background-color: #F3E5F5;
    }

    .option-btn.correct {
        background-color: var(--correct) !important;
        color: white;
        border-color: var(--correct);
        box-shadow: 0 0 15px var(--correct);
    }

    .option-btn.wrong {
        background-color: var(--wrong) !important;
        color: white;
        border-color: var(--wrong);
        animation: shake 0.4s;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    .star {
        position: fixed;
        font-size: 40px;
        animation: flyUp 1s ease-out forwards;
        pointer-events: none;
        z-index: 1000;
    }

    @keyframes flyUp {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(180deg); opacity: 0; }
    }

    #result-screen {
        display: none;
    }

    #result-title {
        font-size: 48px;
        color: var(--primary);
        margin-bottom: 20px;
    }

    #result-text {
        font-size: 32px;
        color: var(--correct);
        margin-bottom: 40px;
    }

    #retake-btn {
        background-color: var(--secondary);
        color: white;
        border: none;
        padding: 20px 50px;
        font-size: 26px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 6px 10px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }

    #retake-btn:hover {
        transform: scale(1.1);
    }

    @media(max-width: 768px) {
        .options-grid {
            grid-template-columns: 1fr;
        }
        #ribbon {
            flex-direction: column;
            gap: 10px;
            font-size: 20px;
            text-align: center;
        }
        #question-text {
            font-size: 20px;
        }
        .option-btn {
            font-size: 18px;
        }
    }
</style>
</head>
<body>

<div id="ribbon">
    <div>📜 5_St Paul The Apostle _ Quiz_Part 1</div>
    <div id="progress-text">Question 1 of 30</div>
    <button id="music-controls" onclick="toggleMusic()">🎵 Play Music</button>
</div>

<div id="game-container">
    <div id="illustration"></div>
    <div id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
</div>

<div id="result-screen">
    <div id="result-title">🌟 Outstanding! 🌟</div>
    <div id="result-text"></div>
    <button id="retake-btn" onclick="retake()">Play Again! 🔄</button>
</div>

<script>
    // --- Audio Synthesizer ---
    let audioCtx;
    let isPlaying = false;
    let loopId;

    function playTone(freq, time, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.08, time + 0.05);
        gain.gain.linearRampToValueAtTime(0, time + duration);
        osc.start(time);
        osc.stop(time + duration);
    }

    function playMelody() {
        if (!isPlaying) return;
        const now = audioCtx.currentTime;
        // Triumphant, steady melody
        const melody = [
            { f: 523.25, t: 0.0, d: 0.4 }, 
            { f: 659.25, t: 0.4, d: 0.4 }, 
            { f: 783.99, t: 0.8, d: 0.4 }, 
            { f: 1046.50, t: 1.2, d: 0.8 }
        ];
        
        melody.forEach(note => playTone(note.f, now + note.t, note.d));
        loopId = setTimeout(playMelody, 3500); 
    }

    function toggleMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const btn = document.getElementById('music-controls');
        if (isPlaying) {
            isPlaying = false;
            clearTimeout(loopId);
            btn.innerHTML = '🎵 Play Music';
        } else {
            isPlaying = true;
            audioCtx.resume();
            playMelody();
            btn.innerHTML = '⏸️ Stop Music';
        }
    }

    // --- Game Logic & Data ---
    const questions = [
        { q: "Where was Saint Paul born?[cite: 2]", o: ["Jerusalem[cite: 2]", "Tarsus in Asia Minor[cite: 2]", "Rome[cite: 2]", "Damascus[cite: 2]"], a: 1, ill: "🗺️" },
        { q: "Tarsus is located in which present-day country?[cite: 2]", o: ["Greece[cite: 2]", "Egypt[cite: 2]", "Turkey[cite: 2]", "Italy[cite: 2]"], a: 2, ill: "🇹🇷" },
        { q: "At that time, Tarsus was a major center for what?[cite: 2]", o: ["Farming[cite: 2]", "Greek philosophy and advancements[cite: 2]", "Fishing[cite: 2]", "Building pyramids[cite: 2]"], a: 1, ill: "🏛️" },
        { q: "Although he was a Jew, what kind of citizenship did Saint Paul have?[cite: 2]", o: ["Roman citizenship[cite: 2]", "Egyptian citizenship[cite: 2]", "Syrian citizenship[cite: 2]", "Babylonian citizenship[cite: 2]"], a: 0, ill: "📜" },
        { q: "Saint Paul was from which tribe?[cite: 2]", o: ["Judah[cite: 2]", "Levi[cite: 2]", "Benjamin[cite: 2]", "Joseph[cite: 2]"], a: 2, ill: "🛡️" },
        { q: "Which strict Jewish group did Saint Paul belong to?[cite: 2]", o: ["The sect of the Pharisees[cite: 2]", "The Sadducees[cite: 2]", "The Essenes[cite: 2]", "The Zealots[cite: 2]"], a: 0, ill: "📖" },
        { q: "What was Saint Paul's Jewish/Hebrew name?[cite: 2]", o: ["Peter[cite: 2]", "John[cite: 2]", "Saul[cite: 2]", "David[cite: 2]"], a: 2, ill: "👤" },
        { q: "What does the name 'Saul' mean?[cite: 2]", o: ["Small[cite: 2]", "Wanted[cite: 2]", "Strong[cite: 2]", "Light[cite: 2]"], a: 1, ill: "🔍" },
        { q: "What does the Greek name 'Paul' mean?[cite: 2]", o: ["Great[cite: 2]", "Wanted[cite: 2]", "Small[cite: 2]", "Wise[cite: 2]"], a: 2, ill: "🌱" },
        { q: "Where did he go to continue his education and learn the Jewish Law?[cite: 2]", o: ["Rome[cite: 2]", "Tarsus[cite: 2]", "Jerusalem[cite: 2]", "Alexandria[cite: 2]"], a: 2, ill: "🕍" },
        { q: "At whose feet was Saint Paul trained?[cite: 2]", o: ["Peter[cite: 2]", "Gamaliel[cite: 2]", "Stephen[cite: 2]", "Ananias[cite: 2]"], a: 1, ill: "👨‍🏫" },
        { q: "Who was Gamaliel?[cite: 2]", o: ["A Roman soldier[cite: 2]", "One of the greatest and most respected teachers among the Jews[cite: 2]", "A tentmaker[cite: 2]", "A fisherman[cite: 2]"], a: 1, ill: "📚" },
        { q: "At the beginning of his life, what did Saint Paul put great effort into doing?[cite: 2]", o: ["Building churches[cite: 2]", "Persecuting many Christians[cite: 2]", "Traveling by sea[cite: 2]", "Writing letters[cite: 2]"], a: 1, ill: "⚔️" },
        { q: "Whose stoning did Saint Paul approve of?[cite: 2]", o: ["Saint Peter[cite: 2]", "Saint John[cite: 2]", "Saint Stephen[cite: 2]", "Saint Mark[cite: 2]"], a: 2, ill: "🪨" },
        { q: "What did Saint Paul do while Saint Stephen was being stoned?[cite: 2]", o: ["He threw stones too[cite: 2]", "He guarded the clothes of those who were stoning him[cite: 2]", "He ran away[cite: 2]", "He cried loudly[cite: 2]"], a: 1, ill: "👕" },
        { q: "Where was Saint Paul on his way to when the Lord Jesus appeared to him?[cite: 2]", o: ["Antioch[cite: 2]", "Ephesus[cite: 2]", "Damascus[cite: 2]", "Rome[cite: 2]"], a: 2, ill: "🛤️" },
        { q: "Why was he going to Damascus?[cite: 2]", o: ["To arrest the Christians there[cite: 2]", "To buy tents[cite: 2]", "To visit his family[cite: 2]", "To preach the Gospel[cite: 2]"], a: 0, ill: "⛓️" },
        { q: "What did the voice say to him on the way to Damascus?[cite: 2]", o: ["'Saul, Saul, where are you going?'[cite: 2]", "'Saul, Saul, why are you persecuting Me?'[cite: 2]", "'Saul, turn back!'[cite: 2]", "'Paul, come to me.'[cite: 2]"], a: 1, ill: "🗣️" },
        { q: "What happened to Paul's sight after the Lord spoke to him?[cite: 2]", o: ["His vision became sharper[cite: 2]", "He could not see[cite: 2]", "He saw everything in bright colors[cite: 2]", "Nothing changed[cite: 2]"], a: 1, ill: "🙈" },
        { q: "How long did he remain in Damascus before Ananias came to him?[cite: 2]", o: ["One day[cite: 2]", "Seven days[cite: 2]", "Three days[cite: 2]", "A month[cite: 2]"], a: 2, ill: "⏳" },
        { q: "Who came to pray for Paul, leading to him receiving his sight and being baptized?[cite: 2]", o: ["Saint Peter[cite: 2]", "Saint Stephen[cite: 2]", "Gamaliel[cite: 2]", "Ananias[cite: 2]"], a: 3, ill: "💧" },
        { q: "After he believed, where did Paul spend a period of solitude for three years?[cite: 2]", o: ["The Arabian desert[cite: 2]", "The mountains of Lebanon[cite: 2]", "The island of Malta[cite: 2]", "The city of Jerusalem[cite: 2]"], a: 0, ill: "🏜️" },
        { q: "Why did he spend three years in the Arabian desert?[cite: 2]", o: ["To hide from the Romans[cite: 2]", "To re-read and understand the Scriptures in the correct way[cite: 2]", "To learn how to farm[cite: 2]", "Because he was lost[cite: 2]"], a: 1, ill: "📖" },
        { q: "After his retreat, where did he return to begin preaching in the synagogues?[cite: 2]", o: ["Tarsus[cite: 2]", "Rome[cite: 2]", "Damascus[cite: 2]", "Athens[cite: 2]"], a: 2, ill: "🕍" },
        { q: "How many missionary journeys did our teacher Paul make?[cite: 2]", o: ["One[cite: 2]", "Two[cite: 2]", "Three[cite: 2]", "Four[cite: 2]"], a: 2, ill: "⛵" },
        { q: "How many epistles (letters) did Saint Paul write?[cite: 2]", o: ["4[cite: 2]", "10[cite: 2]", "12[cite: 2]", "14[cite: 2]"], a: 3, ill: "✉️" },
        { q: "Why do we call our teacher Paul 'the Apostle to the Gentiles'?[cite: 2]", o: ["He only spoke to Jews[cite: 2]", "He is considered the first to preach to the Gentiles[cite: 2]", "He lived in a gentle way[cite: 2]", "He was born a Gentile[cite: 2]"], a: 1, ill: "🌍" },
        { q: "When he went to Caesar in Rome as a prisoner, where was he allowed to live?[cite: 2]", o: ["In a dungeon[cite: 2]", "In a palace[cite: 2]", "In a rented house for two years[cite: 2]", "On a ship[cite: 2]"], a: 2, ill: "🏠" },
        { q: "Who guarded Saint Paul while he was in the rented house in Rome?[cite: 2]", o: ["Ananias[cite: 2]", "A soldier[cite: 2]", "A priest[cite: 2]", "Onesimus[cite: 2]"], a: 1, ill: "🛡️" },
        { q: "How many epistles did Saint Paul write during his imprisonment?[cite: 2]", o: ["Two[cite: 2]", "Four[cite: 2]", "Six[cite: 2]", "Fourteen[cite: 2]"], a: 1, ill: "📜" }
    ];

    let currentQ = 0;
    let score = 0;
    let firstTry = true;

    function shootStars(btn) {
        const rect = btn.getBoundingClientRect();
        const emojis = ['⭐', '✨', '🌟', '🎉'];
        for(let i=0; i<15; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            star.style.left = (rect.left + rect.width/2) + 'px';
            star.style.top = (rect.top + rect.height/2) + 'px';
            
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.random() * 120 + 60;
            let tx = Math.cos(angle) * distance;
            let ty = Math.sin(angle) * distance - 100; 
            
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    function loadQuestion() {
        firstTry = true;
        const q = questions[currentQ];
        document.getElementById('progress-text').innerText = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById('illustration').innerText = q.ill;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        q.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(index, btn) {
        if(btn.classList.contains('wrong') || btn.classList.contains('correct')) return;

        const q = questions[currentQ];
        const buttons = document.querySelectorAll('.option-btn');
        const container = document.getElementById('game-container');
        
        if (index === q.a) {
            btn.classList.add('correct');
            shootStars(btn);
            if (firstTry) score++;
            
            buttons.forEach(b => b.style.pointerEvents = 'none');
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        } else {
            btn.classList.add('wrong');
            firstTry = false;
            
            container.classList.remove('warning');
            void container.offsetWidth; 
            container.classList.add('warning');
        }
    }

    function showResult() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('result-text').innerText = `Amazing Job!\nYou scored ${score} out of ${questions.length} on your first try!\n\nThat's ${percent}%!`;
    }

    function retake() {
        currentQ = 0;
        score = 0;
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        loadQuestion();
    }

    // Initialize Game
    loadQuestion();
</script>
</body>
</html>
