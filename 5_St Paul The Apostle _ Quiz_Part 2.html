<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5_St Paul The Apostle _ Quiz_Part 2</title>
<style>
    :root {
        --primary: #C62828; /* Deep Red */
        --secondary: #FF8F00; /* Amber/Gold */
        --bg: #FFEBEE; /* Light Red/Pink Background */
        --correct: #2E7D32;
        --wrong: #D32F2F;
        --text: #3E2723;
    }

    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
    }

    #ribbon {
        width: 100%;
        background-color: var(--primary);
        color: white;
        padding: 15px 30px;
        font-size: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        position: sticky;
        top: 0;
        z-index: 100;
        font-weight: bold;
    }

    #music-controls {
        cursor: pointer;
        background: var(--secondary);
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }

    #music-controls:hover {
        transform: scale(1.05);
    }

    #game-container, #result-screen {
        background: white;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        padding: 40px;
        margin: 40px 20px;
        max-width: 800px;
        width: 90%;
        text-align: center;
        position: relative;
    }

    .warning {
        animation: flashRed 0.6s ease-in-out 2;
    }

    @keyframes flashRed {
        0% { box-shadow: 0 0 0px var(--wrong); }
        50% { box-shadow: 0 0 30px var(--wrong); }
        100% { box-shadow: 0 0 0px var(--wrong); }
    }

    #illustration {
        font-size: 90px;
        margin: 10px 0 20px 0;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    #question-text {
        font-size: 22px;
        margin-bottom: 40px;
        color: var(--primary);
        font-weight: bold;
        line-height: 1.5;
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .option-btn {
        background-color: #F5F5F5;
        border: 4px solid var(--primary);
        border-radius: 15px;
        padding: 20px;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
        font-family: inherit;
        color: var(--text);
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .option-btn:hover {
        transform: translateY(-5px);
        background-color: #FFEBEE;
    }

    .option-btn.correct {
        background-color: var(--correct) !important;
        color: white;
        border-color: var(--correct);
        box-shadow: 0 0 15px var(--correct);
    }

    .option-btn.wrong {
        background-color: var(--wrong) !important;
        color: white;
        border-color: var(--wrong);
        animation: shake 0.4s;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    .star {
        position: fixed;
        font-size: 40px;
        animation: flyUp 1s ease-out forwards;
        pointer-events: none;
        z-index: 1000;
    }

    @keyframes flyUp {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(180deg); opacity: 0; }
    }

    #result-screen {
        display: none;
    }

    #result-title {
        font-size: 48px;
        color: var(--primary);
        margin-bottom: 20px;
    }

    #result-text {
        font-size: 32px;
        color: var(--correct);
        margin-bottom: 40px;
    }

    #retake-btn {
        background-color: var(--secondary);
        color: white;
        border: none;
        padding: 20px 50px;
        font-size: 26px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 6px 10px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }

    #retake-btn:hover {
        transform: scale(1.1);
    }

    @media(max-width: 768px) {
        .options-grid {
            grid-template-columns: 1fr;
        }
        #ribbon {
            flex-direction: column;
            gap: 10px;
            font-size: 20px;
            text-align: center;
        }
        #question-text {
            font-size: 18px;
        }
        .option-btn {
            font-size: 16px;
        }
    }
</style>
</head>
<body>

<div id="ribbon">
    <div>📜 5_St Paul The Apostle _ Quiz_Part 2</div>
    <div id="progress-text">Question 1 of 30</div>
    <button id="music-controls" onclick="toggleMusic()">🎵 Play Music</button>
</div>

<div id="game-container">
    <div id="illustration"></div>
    <div id="question-text"></div>
    <div class="options-grid" id="options-grid"></div>
</div>

<div id="result-screen">
    <div id="result-title">🌟 You Did It! 🌟</div>
    <div id="result-text"></div>
    <button id="retake-btn" onclick="retake()">Play Again! 🔄</button>
</div>

<script>
    // --- Audio Synthesizer ---
    let audioCtx;
    let isPlaying = false;
    let loopId;

    function playTone(freq, time, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.05, time + 0.05);
        gain.gain.linearRampToValueAtTime(0, time + duration);
        osc.start(time);
        osc.stop(time + duration);
    }

    function playMelody() {
        if (!isPlaying) return;
        const now = audioCtx.currentTime;
        // Hopeful, upbeat melody
        const melody = [
            { f: 261.63, t: 0.0, d: 0.4 }, 
            { f: 329.63, t: 0.4, d: 0.4 }, 
            { f: 392.00, t: 0.8, d: 0.4 }, 
            { f: 523.25, t: 1.2, d: 0.8 }
        ];
        
        melody.forEach(note => playTone(note.f, now + note.t, note.d));
        loopId = setTimeout(playMelody, 3500); 
    }

    function toggleMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const btn = document.getElementById('music-controls');
        if (isPlaying) {
            isPlaying = false;
            clearTimeout(loopId);
            btn.innerHTML = '🎵 Play Music';
        } else {
            isPlaying = true;
            audioCtx.resume();
            playMelody();
            btn.innerHTML = '⏸️ Stop Music';
        }
    }

    // --- Game Logic & Data ---
    const questions = [
        { q: "What are the four epistles written by Saint Paul during his imprisonment called?[cite: 2]", o: ["The Prison Epistles[cite: 2]", "The General Epistles[cite: 2]", "The Roman Letters[cite: 2]", "The Four Gospels[cite: 2]"], a: 0, ill: "⛓️" },
        { q: "Which of these is NOT one of the Prison Epistles?[cite: 2]", o: ["Ephesians[cite: 2]", "Philippians[cite: 2]", "Colossians[cite: 2]", "Hebrews[cite: 2]"], a: 3, ill: "📜" },
        { q: "In which of the Prison Epistles do we learn the story of Onesimus?[cite: 2]", o: ["Philemon[cite: 2]", "Ephesians[cite: 2]", "Colossians[cite: 2]", "Philippians[cite: 2]"], a: 0, ill: "📖" },
        { q: "Who was Onesimus?[cite: 2]", o: ["A Roman soldier[cite: 2]", "A runaway slave belonging to Philemon[cite: 2]", "A merchant[cite: 2]", "A king[cite: 2]"], a: 1, ill: "🏃" },
        { q: "Who was Philemon?[cite: 2]", o: ["A runaway slave[cite: 2]", "A Jewish rabbi[cite: 2]", "A Roman citizen and a merchant[cite: 2]", "A tax collector[cite: 2]"], a: 2, ill: "💰" },
        { q: "In what city did Philemon live?[cite: 2]", o: ["Rome[cite: 2]", "Ephesus[cite: 2]", "Colossae[cite: 2]", "Jerusalem[cite: 2]"], a: 2, ill: "🏛️" },
        { q: "What did Philemon turn his house into?[cite: 2]", o: ["A market[cite: 2]", "A church[cite: 2]", "A school[cite: 2]", "A hospital[cite: 2]"], a: 1, ill: "⛪" },
        { q: "What did Onesimus do that was wrong before he ran away?[cite: 2]", o: ["He lied to the Romans[cite: 2]", "He became greedy and stole from Philemon[cite: 2]", "He burned a house[cite: 2]", "He hit a soldier[cite: 2]"], a: 1, ill: "🛑" },
        { q: "To which city did Onesimus run away with everything he had stolen?[cite: 2]", o: ["Rome[cite: 2]", "Athens[cite: 2]", "Damascus[cite: 2]", "Antioch[cite: 2]"], a: 0, ill: "🗺️" },
        { q: "Who did Onesimus meet while he was in Rome?[cite: 2]", o: ["Caesar[cite: 2]", "Saint Peter[cite: 2]", "The Apostle Paul[cite: 2]", "Gamaliel[cite: 2]"], a: 2, ill: "🤝" },
        { q: "What did Saint Paul speak to Onesimus about?[cite: 2]", o: ["How to escape[cite: 2]", "The Lord Jesus and how He redeemed us by His blood[cite: 2]", "How to make money[cite: 2]", "Roman laws[cite: 2]"], a: 1, ill: "✝️" },
        { q: "After hearing Saint Paul's words, what did Onesimus do?[cite: 2]", o: ["He ran away again[cite: 2]", "He became angry[cite: 2]", "He repented, confessed all his sins, and was baptized[cite: 2]", "He hid in the city[cite: 2]"], a: 2, ill: "💧" },
        { q: "Just as Saint Paul's life changed, what did Onesimus become after knowing Jesus?[cite: 2]", o: ["A soldier[cite: 2]", "A new person and a useful brother in service[cite: 2]", "A merchant[cite: 2]", "A rich man[cite: 2]"], a: 1, ill: "✨" },
        { q: "What did Saint Paul work to bring between Philemon and Onesimus?[cite: 2]", o: ["A business deal[cite: 2]", "A competition[cite: 2]", "Peace and reconciliation[cite: 2]", "An argument[cite: 2]"], a: 2, ill: "🕊️" },
        { q: "In his letter, what did Saint Paul ask Philemon to do for Onesimus?[cite: 2]", o: ["Punish him[cite: 2]", "Send him away[cite: 2]", "Forgive him and pardon him[cite: 2]", "Make him pay double[cite: 2]"], a: 2, ill: "❤️" },
        { q: "How did Saint Paul ask Philemon to receive Onesimus?[cite: 2]", o: ["As a slave[cite: 2]", "As a stranger[cite: 2]", "As an enemy[cite: 2]", "As a brother, not as a slave[cite: 2]"], a: 3, ill: "🫂" },
        { q: "What did Saint Paul promise to do regarding the amount Onesimus had stolen?[cite: 2]", o: ["He promised to repay Philemon for it[cite: 2]", "He asked Philemon to forget it[cite: 2]", "He told Onesimus to find a job to pay it[cite: 2]", "He said it was lost forever[cite: 2]"], a: 0, ill: "🪙" },
        { q: "What position in the church did Onesimus eventually hold?[cite: 2]", o: ["A deacon[cite: 2]", "A pope[cite: 2]", "A bishop of the city of Beroea[cite: 2]", "A monk[cite: 2]"], a: 2, ill: "👑" },
        { q: "On what date did Onesimus receive the crown of martyrdom?[cite: 2]", o: ["The 1st of Tout[cite: 2]", "The 21st of Amshir[cite: 2]", "The 10th of Kiahk[cite: 2]", "The 5th of Baramhat[cite: 2]"], a: 1, ill: "📅" },
        { q: "According to Uncle Matthew, what is the first step for offering true repentance?[cite: 2]", o: ["Write my sins on paper[cite: 2]", "Apologize to someone[cite: 2]", "Have faith in the Lord Jesus and hope that He can forgive my sins[cite: 2]", "Decide to stop the sin[cite: 2]"], a: 2, ill: "🙏" },
        { q: "In the steps for repentance, after admitting my mistake, what must I deeply do?[cite: 2]", o: ["Regret doing it[cite: 2]", "Laugh about it[cite: 2]", "Tell a friend[cite: 2]", "Forget about it[cite: 2]"], a: 0, ill: "😔" },
        { q: "What must I do regarding the source of sin according to Uncle Matthew?[cite: 2]", o: ["Visit it often[cite: 2]", "Stay away from the source of sin so I don't do it again[cite: 2]", "Hide it[cite: 2]", "Talk to it[cite: 2]"], a: 1, ill: "🚫" },
        { q: "How can I prepare for a Confession Session so I don't forget my sins?[cite: 2]", o: ["Tell them to a friend[cite: 2]", "Write my sins on a piece of paper[cite: 2]", "Sing a song[cite: 2]", "Draw a picture[cite: 2]"], a: 1, ill: "📝" },
        { q: "During 'Confession before God' in my room, what should I ask God for?[cite: 2]", o: ["Money and toys[cite: 2]", "Good grades[cite: 2]", "Forgiveness and help to not fall into sin again[cite: 2]", "A new house[cite: 2]"], a: 2, ill: "🙇" },
        { q: "If I upset someone, what is the step called 'Apologize'?[cite: 2]", o: ["Ignore them[cite: 2]", "Humbly apologize and ask them to forgive me[cite: 2]", "Buy them a gift[cite: 2]", "Wait for them to apologize first[cite: 2]"], a: 1, ill: "🤝" },
        { q: "How should I confess to Abouna (my Father of Confession)?[cite: 2]", o: ["Quickly and quietly[cite: 2]", "Without any fear or embarrassment[cite: 2]", "Only if I want to[cite: 2]", "By sending a letter[cite: 2]"], a: 1, ill: "🗣️" },
        { q: "What does Abouna place on my head while praying the absolution?[cite: 2]", o: ["His hand[cite: 2]", "A book[cite: 2]", "The Cross[cite: 2]", "A crown[cite: 2]"], a: 2, ill: "✝️" },
        { q: "Why does Abouna say 'May God absolve you' in the absolution?[cite: 2]", o: ["Because it is a rule[cite: 2]", "To show that God is the One who forgives our sins through the authority He gave to Abouna[cite: 2]", "Because Abouna is God[cite: 2]", "To end the prayer[cite: 2]"], a: 1, ill: "✨" },
        { q: "According to 1 John 1:9, if we confess our sins, He is faithful and just to do what?[cite: 2]", o: ["Remember them forever[cite: 2]", "Punish us[cite: 2]", "Forgive us our sins and cleanse us from all unrighteousness[cite: 2]", "Make us perfect immediately[cite: 2]"], a: 2, ill: "📖" },
        { q: "What was the theme verse that people recited when they left the exhibit?[cite: 2]", o: ["'The Lord is my shepherd' (Psalm 23:1)[cite: 2]", "'Yet in all these things we are more than conquerors through Him who loved us.' (Romans 8:37)[cite: 2]", "'Jesus wept' (John 11:35)[cite: 2]", "'In the beginning God created the heavens' (Genesis 1:1)[cite: 2]"], a: 1, ill: "🏆" }
    ];

    let currentQ = 0;
    let score = 0;
    let firstTry = true;

    function shootStars(btn) {
        const rect = btn.getBoundingClientRect();
        const emojis = ['⭐', '✨', '🌟', '🎉'];
        for(let i=0; i<15; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            star.style.left = (rect.left + rect.width/2) + 'px';
            star.style.top = (rect.top + rect.height/2) + 'px';
            
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.random() * 120 + 60;
            let tx = Math.cos(angle) * distance;
            let ty = Math.sin(angle) * distance - 100; 
            
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    function loadQuestion() {
        firstTry = true;
        const q = questions[currentQ];
        document.getElementById('progress-text').innerText = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById('illustration').innerText = q.ill;
        document.getElementById('question-text').innerText = q.q;
        
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        
        q.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(index, btn) {
        if(btn.classList.contains('wrong') || btn.classList.contains('correct')) return;

        const q = questions[currentQ];
        const buttons = document.querySelectorAll('.option-btn');
        const container = document.getElementById('game-container');
        
        if (index === q.a) {
            btn.classList.add('correct');
            shootStars(btn);
            if (firstTry) score++;
            
            buttons.forEach(b => b.style.pointerEvents = 'none');
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        } else {
            btn.classList.add('wrong');
            firstTry = false;
            
            container.classList.remove('warning');
            void container.offsetWidth; 
            container.classList.add('warning');
        }
    }

    function showResult() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('result-text').innerText = `Amazing Job!\nYou scored ${score} out of ${questions.length} on your first try!\n\nThat's ${percent}%!`;
    }

    function retake() {
        currentQ = 0;
        score = 0;
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        loadQuestion();
    }

    // Initialize Game
    loadQuestion();
</script>
</body>
</html>
