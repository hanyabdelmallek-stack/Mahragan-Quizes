<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلام الصليب</title>
    <style>
        /* التنسيقات الأساسية */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.5s; overflow-x: hidden; }
        body.warning { background: linear-gradient(135deg, #ffe6e6 0%, #ffcccc 100%); }
        #game-container { background: white; width: 90%; max-width: 800px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); padding: 30px; position: relative; text-align: center; border: 4px solid #4a90e2; }
        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { color: #2c3e50; font-size: 2.2em; margin-bottom: 10px; line-height: 1.3; }
        p.subtitle { color: #7f8c8d; font-size: 1.2em; margin-bottom: 30px; }
        .btn-main { background-color: #4a90e2; color: white; border: none; padding: 15px 40px; font-size: 1.5em; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4); transition: transform 0.2s, background-color 0.2s; }
        .btn-main:hover { transform: scale(1.05); background-color: #357abd; }
        #progress-ribbon { background-color: #f1c40f; color: #2c3e50; padding: 10px 20px; border-radius: 20px; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .difficulty-badge { display: inline-block; padding: 5px 15px; border-radius: 15px; color: white; font-size: 0.9em; margin-right: 15px; font-weight: bold; }
        .diff-easy { background-color: #2ecc71; } .diff-medium { background-color: #f39c12; } .diff-hard { background-color: #e74c3c; }
        #question-text { font-size: 1.5em; color: #34495e; margin: 20px 0 30px; line-height: 1.5; font-weight: bold; }
        #options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { #options-container { grid-template-columns: 1fr; } }
        .option-btn { background-color: #ecf0f1; border: 2px solid #bdc3c7; padding: 15px; font-size: 1.15em; border-radius: 15px; cursor: pointer; transition: all 0.3s; color: #2c3e50; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 1.3; }
        .option-btn:hover { background-color: #e0e6ed; border-color: #3498db; transform: translateY(-3px); }
        .option-btn.correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transform: scale(1.05); }
        .option-btn.wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .star { position: absolute; font-size: 2em; pointer-events: none; animation: flyStar 1s ease-out forwards; z-index: 10; }
        @keyframes flyStar { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(2); } }
        #final-score { font-size: 2.5em; color: #d35400; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="screen active">
            <h1>آلام الصليب</h1>
            <p class="subtitle">يَعْظُمُ انْتِصَارُنَا بِالَّذِي أَحَبَّنَا (رو 37:8)</p>
            <p style="font-size: 1.2em; color: #555; margin-bottom: 30px;">اختبر معلوماتك حول آلام الجهاد، وحفظ الوصية، والخدمة كما وردت في درس آلام وأمجاد الصليب.</p>
            <button class="btn-main" onclick="startGame()">▶️ ابدأ اللعب الآن</button>
        </div>
        <div id="game-screen" class="screen">
            <div><span id="progress-ribbon">السؤال ١ من ٣٠</span><span id="difficulty-badge" class="difficulty-badge">سهل</span></div>
            <div id="question-text"></div>
            <div id="options-container"></div>
        </div>
        <div id="result-screen" class="screen">
            <div class="result-icon" id="result-emoji">🏆</div>
            <h1>اكتملت المسابقة!</h1>
            <div id="final-score"></div>
            <p id="result-message" style="font-size: 1.3em; margin-bottom: 30px; color: #34495e;"></p>
            <button class="btn-main" onclick="resetGame()">🔄 العب مرة أخرى</button>
        </div>
    </div>

    <script>
        const questions = [
            {q: "ما هي الرسالة التي تعتبر أكبر رسالة تتحدث عن الآلام والأمجاد معاً؟[cite: 11]", options: ["رسالة بطرس الرسول الأولى[cite: 11]", "رسالة يوحنا الأولى[cite: 11]", "رسالة رومية[cite: 11]", "رسالة غلاطية[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "لماذا قال السيد المسيح 'قَدْ أَتَتِ السَّاعَةُ لِيَتَمَجْدَ ابْنُ الإِنْسَانِ' ولم يقل 'يتألم'؟[cite: 11]", options: ["لأنه نسي ألمه[cite: 11]", "لأن الألم طريق المجد[cite: 11]", "لأن المجد قبل الألم[cite: 11]", "لأن التلاميذ لم يفهموا[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "المؤمن الحقيقي لا يبحث عن المجد، بل يبحث عن...[cite: 11]", options: ["الراحة[cite: 11]", "الألم كتعبير حب فيمجده الرب[cite: 11]", "السلطة[cite: 11]", "المديح[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "للخطية ثلاثة أبعاد ذكرها الدرس، هي: فكري و...[cite: 11]", options: ["سلوكي وعاطفي(وجداني)[cite: 11]", "جسدي ومادي[cite: 11]", "روحي واجتماعي[cite: 11]", "مكاني وزماني[cite: 11]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "يقول علماء النفس أن تغيير الفكر ممكن، والوجدان صعب، وتغيير السلوك...[cite: 11]", options: ["سهل جداً[cite: 11]", "أصعب[cite: 11]", "مستحيل[cite: 11]", "طبيعي[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "الإنسان الطبيعي قد يخطئ في محاولة التغيير لأنه يحارب نفسه، أما الإنسان المسيحي فيحدث له...[cite: 11]", options: ["إعادة الخلق[cite: 11]", "علاج نفسي فقط[cite: 11]", "نسيان الماضي[cite: 11]", "تحكم كامل[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ما هي المقولة الشهيرة للقديس أغسطينوس عن الخلاص؟[cite: 11]", options: ["الله خلقك بدونك، لكنه يخلصك بدونك[cite: 11]", "الله الذي خلقك بدونك لا يشاء أن يخلصك بدونك[cite: 11]", "الخلاص هو هبة فقط[cite: 11]", "الجهاد ليس ضرورياً[cite: 11]"], answer: 1, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "الألم الأول في حياة المؤمن الذي يريد أن يكون ملكاً لله هو...[cite: 11]", options: ["آلام الجهاد ضد السلبيات (الذات، الجسد، الشهوات)[cite: 11]", "آلام المرض الجسدي[cite: 11]", "آلام الفقر[cite: 11]", "آلام الغربة[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "الجهاد الروحي (مثل الصلاة والصوم) يعتبر ألماً...[cite: 11]", options: ["سلبياً[cite: 11]", "إيجابياً لأني أقتني النعمة[cite: 11]", "غير ضروري[cite: 11]", "يخص القديسين فقط[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "'الجسد يشتهي ضد الروح والروح ضد الجسد' هي دعوة لـ...[cite: 11]", options: ["الجهاد المستمر[cite: 11]", "ترك الجسد تماماً[cite: 11]", "اليأس من النجاح[cite: 11]", "إهمال الصلاة[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "تنفيذ وصية 'لا تدينوا لكي لا تدانوا' يراه الراهب في قصة الدرس أنه...[cite: 11]", options: ["سهل جداً[cite: 11]", "ليس سهلاً لأن أسهل شيء هو إدانة الناس[cite: 11]", "غير مهم[cite: 11]", "مستحيل[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "المحبة المسيحية المطلوبة هي المحبة 'بالرغم من'، وهي محبة...[cite: 11]", options: ["إلهية[cite: 11]", "عاطفية[cite: 11]", "سياسية[cite: 11]", "مصلحية[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "الفرق بين الفيليا والأغابي هو أن 'الأغابي' هي...[cite: 11]", options: ["محبة منفعة متبادلة[cite: 11]", "محبة روحانية إيجابية صادقة تقدم الصفح[cite: 11]", "محبة عاطفية فقط[cite: 11]", "محبة سياسية[cite: 11]"], answer: 1, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "دليل محبة الإنسان لله هو...[cite: 11]", options: ["محبته لإخوته[cite: 11]", "كثرة صومه[cite: 11]", "كثرة معرفته[cite: 11]", "مظهره الخارجي[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ما هي علامة تلمذة السيد المسيح بحسب يو 13؟[cite: 11]", options: ["الحب بعضنا لبعض[cite: 11]", "القدرة على المعجزات[cite: 11]", "المكانة في الكنيسة[cite: 11]", "عدد الأتباع[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "خدمة غسل الأقدام ترمز لـ...[cite: 11]", options: ["الاحتمال والاتضاع[cite: 11]", "التنظيف الجسدي[cite: 11]", "الهيبة والوضع[cite: 11]", "الإمكانيات الكبيرة[cite: 11]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "يجب الحذر من خدمة الـ (Prestige) أو خدمة الوضع والهيبة، والبديل هو...[cite: 11]", options: ["خدمة النفس المتضعة الوديعة[cite: 11]", "خدمة النشاط الكبير[cite: 11]", "خدمة الإدارة القوية[cite: 11]", "خدمة الكلام فقط[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "لو سحبت تيار الحب من خدمة كلمة ربنا، تصبح الكلمة...[cite: 11]", options: ["كلمة بشر لا تفيد[cite: 11]", "كلمة قوية جداً[cite: 11]", "كلمة سماوية[cite: 11]", "كلمة ناجحة[cite: 11]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "الذاتية الجماعية تعني...[cite: 11]", options: ["انحياز مجموعة من الخدام لبعضهم البعض مما قد يفقدهم الموضوعية[cite: 11]", "الخدمة بروح واحدة[cite: 11]", "العمل الجماعي الناجح[cite: 11]", "طاعة الكنيسة[cite: 11]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "من أقوال البستان: كن مطروداً لا طارداً، وكن...[cite: 11]", options: ["ظالماً لا مظلوماً[cite: 11]", "مظلوماً لا ظالماً[cite: 11]", "قوياً لا ضعيفاً[cite: 11]", "غائباً لا حاضراً[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "المسيحية ليست محبة عاطفية بل هي...[cite: 11]", options: ["محبة روحانية[cite: 11]", "محبة عقلية فقط[cite: 11]", "محبة مؤقتة[cite: 11]", "لا شيء مما سبق[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "أصعب شيء في الجهاد الروحي هو...[cite: 11]", options: ["إدانة الناس[cite: 11]", "إدانة النفس[cite: 11]", "صوم يوم كامل[cite: 11]", "الذهاب للكنيسة[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "كيف نتصالح مع الصليب؟[cite: 11]", options: ["بوضع ذواتنا وطاعة مشيئة الله[cite: 11]", "بطلب الراحة[cite: 11]", "بالهروب من الألم[cite: 11]", "بالافتخار بالمعرفة[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ما الذي يجعل تعليم الإنجيل يتزيف ويصير للافتخار؟[cite: 11]", options: ["وجود 'فكر المسيح'[cite: 11]", "عدم وجود 'فكر المسيح' جهة الصليب[cite: 11]", "كثرة الصلاة[cite: 11]", "الالتزام بالوصية[cite: 11]"], answer: 1, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "المسيح علمنا أن نحب الذين يحبوننا، وعلمنا أيضاً أن...[cite: 11]", options: ["نكره الذين يضروننا[cite: 11]", "نحب الذين لا يحبوننا[cite: 11]", "نبتعد عن الخطاة[cite: 11]", "ننتقم لأنفسنا[cite: 11]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "الخدمة تتطلب عطاءً...[cite: 11]", options: ["بدنياً وروحياً[cite: 11]", "مادياً فقط[cite: 11]", "إدارياً فقط[cite: 11]", "كلامياً فقط[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "نحن نخدم بالحب وليس بـ...[cite: 11]", options: ["الإمكانيات[cite: 11]", "الصلاة[cite: 11]", "الروح[cite: 11]", "البذل[cite: 11]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "يجب علينا كخدام أن نكون مظلومين لا...[cite: 11]", options: ["ظالمين[cite: 11]", "صابرين[cite: 11]", "متضعين[cite: 11]", "محبين[cite: 11]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "المسيح رغم كل ما مر به قال: 'يَا أَبَتاهُ، اغْفِرْ لَهُمْ، لأَنَّهُمْ...'[cite: 11]", options: ["لَا يَعْلَمُونَ مَاذَا يَفْعَلُونَ[cite: 11]", "يجهلون عظمتي[cite: 11]", "يحتاجون للتوبة[cite: 11]", "سوف يندمون[cite: 11]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ما هو المبدأ الذي تخدم به النفس المتضعة الوديعة؟[cite: 11]", options: ["يَنْبَغِى أَنَّ ذَلِكَ يَزِيدُ وَأَنِّى أَنَا أَنْقُصُ[cite: 11]", "أنا أولاً[cite: 11]", "الهدف يبرر الوسيلة[cite: 11]", "التميز عن الآخرين[cite: 11]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"}
        ];

        let currentQuestionIndex = 0, score = 0, firstAttempt = true;
        function startGame() { document.getElementById('start-screen').classList.remove('active'); document.getElementById('game-screen').classList.add('active'); currentQuestionIndex = 0; score = 0; loadQuestion(); }
        function loadQuestion() {
            firstAttempt = true;
            const q = questions[currentQuestionIndex];
            document.getElementById('progress-ribbon').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            const badge = document.getElementById('difficulty-badge'); badge.innerText = q.difficulty; badge.className = `difficulty-badge ${q.diffClass}`;
            document.getElementById('question-text').innerText = q.q;
            const optionsContainer = document.getElementById('options-container'); optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt; btn.onclick = () => checkAnswer(index, btn); optionsContainer.appendChild(btn);
            });
        }
        function checkAnswer(selectedIndex, button) {
            if (selectedIndex === questions[currentQuestionIndex].answer) {
                button.classList.add('correct');
                const allButtons = document.querySelectorAll('.option-btn'); allButtons.forEach(btn => btn.style.pointerEvents = 'none');
                if (firstAttempt) score++;
                showStarsEffect(button);
                document.body.classList.remove('warning');
                setTimeout(() => { currentQuestionIndex++; currentQuestionIndex < questions.length ? loadQuestion() : showResult(); }, 1500);
            } else {
                firstAttempt = false; button.classList.add('wrong'); button.style.pointerEvents = 'none';
                document.body.classList.add('warning'); setTimeout(() => document.body.classList.remove('warning'), 500);
            }
        }
        function showStarsEffect(button) {
            const rect = button.getBoundingClientRect();
            const x = rect.left + rect.width / 2; const y = rect.top + rect.height / 2;
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div'); star.className = 'star'; star.innerText = '✨';
                star.style.left = x + 'px'; star.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2; const distance = 80 + Math.random() * 50;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1000);
            }
        }
        function showResult() {
            document.getElementById('game-screen').classList.remove('active'); document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score').innerText = `النتيجة: ${score} من ${questions.length}`;
            let message = score === questions.length ? "ممتاز جداً! أنت ملم بكل تفاصيل هذا الدرس ببراعة." : (score >= 20 ? "رائع! أداء جميل جداً ومجهود مقدر." : "محاولة جيدة! نرجو مراجعة الدرس مرة أخرى.");
            document.getElementById('result-message').innerText = message;
            document.getElementById('result-emoji').innerText = score === questions.length ? "👑" : "🌟";
        }
        function resetGame() { document.getElementById('result-screen').classList.remove('active'); document.getElementById('start-screen').classList.add('active'); }
    </script>
</body>
</html>
