<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إختبر معلوماتك _ أقوال الآباء عن إشارة الصليب</title>
    <style>
        /* التنسيقات الأساسية */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.5s; overflow-x: hidden; }
        body.warning { background: linear-gradient(135deg, #ffe6e6 0%, #ffcccc 100%); }
        #game-container { background: white; width: 90%; max-width: 800px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); padding: 30px; position: relative; text-align: center; border: 4px solid #4a90e2; }
        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { color: #2c3e50; font-size: 2.2em; margin-bottom: 10px; line-height: 1.3; }
        p.subtitle { color: #7f8c8d; font-size: 1.2em; margin-bottom: 30px; }
        .btn-main { background-color: #4a90e2; color: white; border: none; padding: 15px 40px; font-size: 1.5em; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4); transition: transform 0.2s, background-color 0.2s; }
        .btn-main:hover { transform: scale(1.05); background-color: #357abd; }
        #progress-ribbon { background-color: #f1c40f; color: #2c3e50; padding: 10px 20px; border-radius: 20px; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .difficulty-badge { display: inline-block; padding: 5px 15px; border-radius: 15px; color: white; font-size: 0.9em; margin-right: 15px; font-weight: bold; }
        .diff-easy { background-color: #2ecc71; } .diff-medium { background-color: #f39c12; } .diff-hard { background-color: #e74c3c; }
        #question-text { font-size: 1.5em; color: #34495e; margin: 20px 0 30px; line-height: 1.5; font-weight: bold; }
        #options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { #options-container { grid-template-columns: 1fr; } }
        .option-btn { background-color: #ecf0f1; border: 2px solid #bdc3c7; padding: 15px; font-size: 1.15em; border-radius: 15px; cursor: pointer; transition: all 0.3s; color: #2c3e50; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 1.3; }
        .option-btn:hover { background-color: #e0e6ed; border-color: #3498db; transform: translateY(-3px); }
        .option-btn.correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transform: scale(1.05); }
        .option-btn.wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .star { position: absolute; font-size: 2em; pointer-events: none; animation: flyStar 1s ease-out forwards; z-index: 10; }
        @keyframes flyStar { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(2); } }
        #final-score { font-size: 2.5em; color: #d35400; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="screen active">
            <h1>أقوال الآباء عن إشارة الصليب</h1>
            <p class="subtitle">يَعْظُمُ انْتِصَارُنَا بِالَّذِي أَحَبَّنَا (رو 37:8)</p>
            <p style="font-size: 1.2em; color: #555; margin-bottom: 30px;">استعد لاختبار معلوماتك حول أقوال الآباء (أثناسيوس، الأنبا أنطونيوس، مار أفرام، وغيرهم) عن قوة وعظمة الصليب.</p>
            <button class="btn-main" onclick="startGame()">▶️ ابدأ اللعب الآن</button>
        </div>
        <div id="game-screen" class="screen">
            <div><span id="progress-ribbon">السؤال ١ من ٣٠</span><span id="difficulty-badge" class="difficulty-badge">سهل</span></div>
            <div id="question-text"></div>
            <div id="options-container"></div>
        </div>
        <div id="result-screen" class="screen">
            <div class="result-icon" id="result-emoji">🏆</div>
            <h1>اكتملت المسابقة!</h1>
            <div id="final-score"></div>
            <p id="result-message" style="font-size: 1.3em; margin-bottom: 30px; color: #34495e;"></p>
            <button class="btn-main" onclick="resetGame()">🔄 العب مرة أخرى</button>
        </div>
    </div>

    <script>
        const questions = [
            {q: "من هو الأب الذي قال أن الصليب سلاح نافذ ينفذ في النار والهواء والماء والأرض؟[cite: 10]", options: ["البابا أثناسيوس الرسولي[cite: 10]", "مار أفرام السرياني[cite: 10]", "الأنبا أنطونيوس[cite: 10]", "يوحنا ذهبي الفم[cite: 10]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "بحسب البابا أثناسيوس، ماذا تفعل الشياطين عندما تشاهد رسم الصليب؟[cite: 10]", options: ["تخضع لقوته وتهرب[cite: 10]", "تحاول مقاوته[cite: 10]", "تسخر منه[cite: 10]", "لا تبالي به[cite: 10]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "من الأب الذي نصحنا بطبع صورة الصليب على أعضائنا وقلوبنا بدلاً من حمل سلاح؟[cite: 10]", options: ["مار أفرام السرياني[cite: 10]", "القديس كيرلس[cite: 10]", "البابا أثناسيوس[cite: 10]", "القديس أنطونيوس[cite: 10]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "مار أفرام السرياني نصحنا برسم الصليب في...[cite: 10]", options: ["دخولنا وخروجنا، جلوسنا وقيامنا، نومنا وعملنا[cite: 10]", "الكنيسة فقط[cite: 10]", "قبل الصلاة فقط[cite: 10]", "أيام الأعياد فقط[cite: 10]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "يوحنا ذهبي الفم يصف الصليب بأنه ينبوع...[cite: 10]", options: ["الشجاعة والبركات[cite: 10]", "الألم والضعف[cite: 10]", "العثرة والجهالة[cite: 10]", "الخوف والتردد[cite: 10]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "القديس الأنبا أنطونيوس يقول إن الشياطين توجه هجماتها المنظورة إلى...[cite: 10]", options: ["الأقوياء[cite: 10]", "الجبناء[cite: 10]", "الأغنياء[cite: 10]", "الحكماء[cite: 10]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "القديس كيرلس الأورشليمي يشبّه الصليب بالحية النحاسية التي أبطلت...[cite: 10]", options: ["سم الحيات[cite: 10]", "الجوع والعطش[cite: 10]", "الخوف من فرعون[cite: 10]", "التعب الجسدي[cite: 10]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "لماذا نكرم الصليب قبل أن نطلب معونة القديسين أو شفاعتهم؟[cite: 10]", options: ["لأنه علامة ابن الإنسان ورسم تجسده وآلامه[cite: 10]", "لأنه أجمل في المنظر[cite: 10]", "لأنه لا يوجد سبب[cite: 10]", "لأنه من الذهب[cite: 10]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "حيثما وُجدت إشارة الصليب، بحسب الأنبا أنطونيوس، فإن السحر...[cite: 10]", options: ["يزداد[cite: 10]", "يضعف وتتلاشى قوة العرافة[cite: 10]", "يبقى كما هو[cite: 10]", "يتحول لخير[cite: 10]"], answer: 1, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "كيف قام الأنبا أنطونيوس بتطهير المرضى المعذبين من الأرواح النجسة أمام الفلاسفة؟[cite: 10]", options: ["بالحجج العلمية[cite: 10]", "برشمهم ثلاث مرات بعلامة الصليب[cite: 10]", "بتقديم القرابين[cite: 10]", "بالسحر[cite: 10]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "كيف يرتد هجوم الشياطين على الرهبان خائباً؟[cite: 10]", options: ["بالهرب[cite: 10]", "بالصلاة والصوم وتحصين النفس بالإيمان وعلامة الصليب[cite: 10]", "بمقاومة الأفكار فقط[cite: 10]", "بالتجربة[cite: 10]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "ماذا نفعل إذا مدحت الشياطين نسكنا ودعتنا مباركين؟[cite: 10]", options: ["نفرح بمديحها[cite: 10]", "نرشم أنفسنا وبيوتنا بعلامة الصليب ونصلي[cite: 10]", "نناقشها في أمور روحية[cite: 10]", "نصدقها[cite: 10]"], answer: 1, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "لماذا تخشى الشياطين إشارة الصليب جداً؟[cite: 10]", options: ["لأنها في غاية الجبن، ولأن الرب قد جردها وأشهرها جهاراً على الصليب[cite: 10]", "لأنها تحترق من ضوئه[cite: 10]", "لأنها تسبب لها ألماً جسدياً[cite: 10]", "لا يوجد سبب[cite: 10]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "القديس كيرلس الأورشليمي يرى في الحية النحاسية رمزاً لما فعله المسيح الذي...[cite: 10]", options: ["رفع عنا المرض[cite: 10]", "سكب دمه الطاهر ليصير لنا بالدم الحياة وبالصليب النصرة[cite: 10]", "أعطانا الناموس[cite: 10]", "علمنا الصلاة[cite: 10]"], answer: 1, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "علامة الصليب هي الإشارة المشتركة بين جميع المؤمنين كرمز لـ...[cite: 10]", options: ["الخلاص والمحبة المشتركة[cite: 10]", "الخوف والترقب[cite: 10]", "القوة المادية[cite: 10]", "العادات والتقاليد[cite: 10]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "مار أفرام السرياني يؤكد أن رسم الصليب يجب أن يكون باليد، وأيضاً بـ...[cite: 10]", options: ["الذهن والفكر[cite: 10]", "الصوت العالي[cite: 10]", "اللباس الخارجي[cite: 10]", "المال[cite: 10]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "القديس الأنبا أنطونيوس ينصحنا بعدم المعاملة مع الشياطين إذا مدحتنا، بل بالأحرى...[cite: 10]", options: ["نصمت[cite: 10]", "نرشم ذواتنا بالصليب ونصلي[cite: 10]", "نترك المكان[cite: 10]", "نصوم يومين[cite: 10]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "الأنبا أنطونيوس تحدى الفلاسفة قائلاً: 'كفوا عن منازعتنا.. وعندئذ ترون...'[cite: 10]", options: ["قوة سحرنا[cite: 10]", "قوة صليب المسيح[cite: 10]", "قدرة أصنامكم[cite: 10]", "ضعفنا[cite: 10]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "يقول البابا أثناسيوس: لا تحصل تخلية (ترك) لمن حمل الصليب إلا لمن...[cite: 10]", options: ["ضعفت أمانته فيه[cite: 10]", "تعب كثيراً[cite: 10]", "مرض جسدياً[cite: 10]", "ابتعد عن الكنيسة[cite: 10]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "يوحنا ذهبي الفم يطلب منا أن نلبس علامة الصليب ونفتخر به كـ...[cite: 10]", options: ["درع[cite: 10]", "تاج[cite: 10]", "سيف[cite: 10]", "ثوب[cite: 10]"], answer: 1, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "الأنبا أنطونيوس يؤكد أن الشياطين تخشى جداً علامة صليب الرب لأن...[cite: 10]", options: ["تخاف من الكهنة[cite: 10]", "الرب جردها وأشهرها جهاراً على الصليب[cite: 10]", "تتجنب المسيحيين القديسين[cite: 10]", "لا يوجد سبب[cite: 10]"], answer: 1, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "أين كان يعزل الأبرص قديماً؟[cite: 10]", options: ["في وسط المدينة[cite: 10]", "في أطراف المدينة[cite: 10]", "في الجبال البعيدة[cite: 10]", "في معابد خاصة[cite: 10]"], answer: 1, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "أكد الأنبا أنطونيوس للفلاسفة أن المرضى المعذبين من الأرواح النجسة شُفوا فوراً بعد...[cite: 10]", options: ["شربوا من ماء خاص[cite: 10]", "رشمهم بالصليب[cite: 10]", "تلاوة تعاويذ[cite: 10]", "استخدام أعشاب[cite: 10]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "القديس كيرلس الأورشليمي يرى أن الصليب هو علامة...[cite: 10]", options: ["نصرة الشيطان[cite: 10]", "ابن الإنسان[cite: 10]", "الحكمة البشرية[cite: 10]", "الخوف من الموت[cite: 10]"], answer: 1, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "البابا أثناسيوس يقول إن الصليب هو قوة المسيح للخلاص، و...[cite: 10]", options: ["الملائكة يخضعون لقوته[cite: 10]", "الشياطين تتحالف معه[cite: 10]", "البشر لا يقدرون عليه[cite: 10]", "لا أحد يفهمه[cite: 10]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "القديس أنطونيوس يدعونا لتحصين أنفسنا بعلامة الصليب بدلاً من...[cite: 10]", الخوف من هجمات الشياطين[cite: 10]", "الهروب من الصعاب[cite: 10]", "المديح الباطل[cite: 10]", "التفكير في الخطية[cite: 10]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "يوحنا ذهبي الفم يقول عن علامة الصليب إنها ينبوع...[cite: 10]", options: ["البركات[cite: 10]", "الدموع[cite: 10]", "الخسارة[cite: 10]", "الضعف[cite: 10]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "القديس كيرلس الأورشليمي يوضح أن السيد المسيح على الصليب قدم نفسه...[cite: 10]", options: ["ذبيحة لله الآب من أجل خطايانا[cite: 10]", "مجرد مثال للصبر[cite: 10]", "كقائد جيش[cite: 10]", "كعظيم في قومه[cite: 10]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "ماذا يفعل الرهبان والمؤمنون المجدون عندما تهاجمهم الشياطين بالأفكار الشريرة؟[cite: 10]", options: ["يستسلمون[cite: 10]", "يتحصنون بالإيمان وعلامة الصليب[cite: 10]", "يغضبون[cite: 10]", "يسألون الفلاسفة[cite: 10]"], answer: 1, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "يقول البابا أثناسيوس عن قوة الصليب إنها لا تحجبها ولا تعترضها...[cite: 10]", options: ["قوة نار أو هواء أو ماء أو أرض[cite: 10]", "قوة الشيطان[cite: 10]", "حكمة الناس[cite: 10]", "أعمال البشر[cite: 10]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"}
        ];

        // منطق اللعبة
        let currentQuestionIndex = 0, score = 0, firstAttempt = true;
        function startGame() { document.getElementById('start-screen').classList.remove('active'); document.getElementById('game-screen').classList.add('active'); currentQuestionIndex = 0; score = 0; loadQuestion(); }
        function loadQuestion() {
            firstAttempt = true;
            const q = questions[currentQuestionIndex];
            document.getElementById('progress-ribbon').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            const badge = document.getElementById('difficulty-badge'); badge.innerText = q.difficulty; badge.className = `difficulty-badge ${q.diffClass}`;
            document.getElementById('question-text').innerText = q.q;
            const optionsContainer = document.getElementById('options-container'); optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt; btn.onclick = () => checkAnswer(index, btn); optionsContainer.appendChild(btn);
            });
        }
        function checkAnswer(selectedIndex, button) {
            if (selectedIndex === questions[currentQuestionIndex].answer) {
                button.classList.add('correct');
                const allButtons = document.querySelectorAll('.option-btn'); allButtons.forEach(btn => btn.style.pointerEvents = 'none');
                if (firstAttempt) score++;
                showStarsEffect(button);
                document.body.classList.remove('warning');
                setTimeout(() => { currentQuestionIndex++; currentQuestionIndex < questions.length ? loadQuestion() : showResult(); }, 1500);
            } else {
                firstAttempt = false; button.classList.add('wrong'); button.style.pointerEvents = 'none';
                document.body.classList.add('warning'); setTimeout(() => document.body.classList.remove('warning'), 500);
            }
        }
        function showStarsEffect(button) {
            const rect = button.getBoundingClientRect();
            const x = rect.left + rect.width / 2; const y = rect.top + rect.height / 2;
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div'); star.className = 'star'; star.innerText = '✨';
                star.style.left = x + 'px'; star.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2; const distance = 80 + Math.random() * 50;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1000);
            }
        }
        function showResult() {
            document.getElementById('game-screen').classList.remove('active'); document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score').innerText = `النتيجة: ${score} من ${questions.length}`;
            let message = score === questions.length ? "ممتاز! أنت تحفظ أقوال الآباء عن الصليب جيداً." : (score >= 20 ? "رائع! معلوماتك قوية." : "محاولة جيدة، راجع الدرس مرة أخرى.");
            document.getElementById('result-message').innerText = message;
            document.getElementById('result-emoji').innerText = score === questions.length ? "👑" : "🌟";
        }
        function resetGame() { document.getElementById('result-screen').classList.remove('active'); document.getElementById('start-screen').classList.add('active'); }
    </script>
</body>
</html>
