<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمجاد الصليب</title>
    <style>
        /* التنسيقات الأساسية */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.5s; overflow-x: hidden; }
        body.warning { background: linear-gradient(135deg, #ffe6e6 0%, #ffcccc 100%); }
        #game-container { background: white; width: 90%; max-width: 800px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); padding: 30px; position: relative; text-align: center; border: 4px solid #4a90e2; }
        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { color: #2c3e50; font-size: 2.2em; margin-bottom: 10px; line-height: 1.3; }
        p.subtitle { color: #7f8c8d; font-size: 1.2em; margin-bottom: 30px; }
        .btn-main { background-color: #4a90e2; color: white; border: none; padding: 15px 40px; font-size: 1.5em; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4); transition: transform 0.2s, background-color 0.2s; }
        .btn-main:hover { transform: scale(1.05); background-color: #357abd; }
        #progress-ribbon { background-color: #f1c40f; color: #2c3e50; padding: 10px 20px; border-radius: 20px; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .difficulty-badge { display: inline-block; padding: 5px 15px; border-radius: 15px; color: white; font-size: 0.9em; margin-right: 15px; font-weight: bold; }
        .diff-easy { background-color: #2ecc71; } .diff-medium { background-color: #f39c12; } .diff-hard { background-color: #e74c3c; }
        #question-text { font-size: 1.5em; color: #34495e; margin: 20px 0 30px; line-height: 1.5; font-weight: bold; }
        #options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { #options-container { grid-template-columns: 1fr; } }
        .option-btn { background-color: #ecf0f1; border: 2px solid #bdc3c7; padding: 15px; font-size: 1.15em; border-radius: 15px; cursor: pointer; transition: all 0.3s; color: #2c3e50; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 1.3; }
        .option-btn:hover { background-color: #e0e6ed; border-color: #3498db; transform: translateY(-3px); }
        .option-btn.correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transform: scale(1.05); }
        .option-btn.wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .star { position: absolute; font-size: 2em; pointer-events: none; animation: flyStar 1s ease-out forwards; z-index: 10; }
        @keyframes flyStar { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(2); } }
        #final-score { font-size: 2.5em; color: #d35400; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="screen active">
            <h1>أمجاد الصليب</h1>
            <p class="subtitle">يَعْظُمُ انْتِصَارُنَا بِالَّذِي أَحَبَّنَا (رو 37:8)</p>
            <p style="font-size: 1.2em; color: #555; margin-bottom: 30px;">استعد لاختبار معلوماتك حول أمجاد القداسة، السعادة الأبدية، الشركة، التجديد، والتقديس المرتبطة بعمل الصليب.</p>
            <button class="btn-main" onclick="startGame()">▶️ ابدأ اللعب الآن</button>
        </div>
        <div id="game-screen" class="screen">
            <div><span id="progress-ribbon">السؤال ١ من ٣٠</span><span id="difficulty-badge" class="difficulty-badge">سهل</span></div>
            <div id="question-text"></div>
            <div id="options-container"></div>
        </div>
        <div id="result-screen" class="screen">
            <div class="result-icon" id="result-emoji">🏆</div>
            <h1>اكتملت المسابقة!</h1>
            <div id="final-score"></div>
            <p id="result-message" style="font-size: 1.3em; margin-bottom: 30px; color: #34495e;"></p>
            <button class="btn-main" onclick="resetGame()">🔄 العب مرة أخرى</button>
        </div>
    </div>

    <script>
        const questions = [
            {q: "ماذا يثمر روح الله القدوس في المؤمن ليصير مقدساً للرب؟[cite: 12]", options: ["ثماراً روحية (محبة، فرح، سلام...)[cite: 12]", "غنى مادي[cite: 12]", "شهرة عالمية[cite: 12]", "قوة جسدية[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "بماذا مُسح المؤمن في المعمودية ليصير هيكلاً للروح القدس؟[cite: 12]", options: ["زيت الميرون[cite: 12]", "الماء العادي[cite: 12]", "دهن الملح[cite: 12]", "زيت الزيتون[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ماذا يرمز الثياب البيض التي يلبسها المفديون في رؤيا يوحنا؟[cite: 12]", options: ["الطهارة والنقاوة[cite: 12]", "الانتصار في الحرب[cite: 12]", "الغنى الروحي[cite: 12]", "الخدمة فقط[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "ما هو الشرط الذي بدونه لن يرى أحد الرب؟[cite: 12]", options: ["القداسة[cite: 12]", "التعليم اللاهوتي[cite: 12]", "المركز الكنسي[cite: 12]", "الموهبة[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ما الذي يحمله المفديون علامة للظفر والانتصار على الشر؟[cite: 12]", options: ["سعف النخل[cite: 12]", "أغصان الزيتون[cite: 12]", "الزهور[cite: 12]", "القمح[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "من هم الذين يعاينون الله؟[cite: 12]", options: ["أنقياء القلب[cite: 12]", "الأقوياء[cite: 12]", "العلماء[cite: 12]", "أصحاب المواهب[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ما هي مكافأة من يغلب ويأكل من شجرة الحياة؟[cite: 12]", options: ["سكنى الفردوس[cite: 12]", "المجد الأرضي[cite: 12]", "الراحة الجسدية[cite: 12]", "النجاح المهني[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "يسمع المؤمن في العالم الآخر: 'نِعِمَّا أَيُّهَا الْعَبْدُ الصَّالِحُ الْأَمِينُ كُنْتَ أَمِينًا فِي...'[cite: 12]", options: ["القليل[cite: 12]", "الكثير[cite: 12]", "الموهبة[cite: 12]", "الخدمة[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "من هم الذين نلتقي بهم في محفل الأبرار المكملين؟[cite: 12]", options: ["الملائكة والقديسين[cite: 12]", "أهل العالم فقط[cite: 12]", "الناس الذين نحبهم فقط[cite: 12]", "لا أحد[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "عبارة 'شركاء الطبيعة الإلهية' تعني الشركة في...[cite: 12]", options: ["جوهر اللاهوت[cite: 12]", "العمل والمواهب والمحبة والميراث[cite: 12]", "القدرة على الخلق[cite: 12]", "الوجود في كل مكان[cite: 12]"], answer: 1, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "نحن لسنا شركاء في الطبيعة الإلهية من حيث الجوهر، لأن الطبيعة الإلهية...[cite: 12]", options: ["أزلية وغير محدودة[cite: 12]", "مخلوقة[cite: 12]", "تتغير[cite: 12]", "بسيطة[cite: 12]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "ما الذي سيغير شكل جسد تواضعنا؟[cite: 12]", options: ["جسد مجد المسيح[cite: 12]", "الصوم الطويل[cite: 12]", "النشاط البدني[cite: 12]", "العمل الخيري[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "بنوة المسيح للآب هي بنوة...[cite: 12]", options: ["بالطبيعة[cite: 12]", "بالتبني[cite: 12]", "بالعمل[cite: 12]", "بالموهبة[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "بنوة الإنسان لله هي بنوة...[cite: 12]", options: ["بالطبيعة[cite: 12]", "بالتبني[cite: 12]", "بالخلق فقط[cite: 12]", "بالخدمة[cite: 12]"], answer: 1, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ابْتُلِعَ الْمَوْتُ إِلَى غَلَبَةٍ، هي نبوة لـ...[cite: 12]", options: ["إشعياء النبي[cite: 12]", "إرميا النبي[cite: 12]", "موسى النبي[cite: 12]", "داود النبي[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "ماذا قال السيد المسيح للص اليمين وهو على الصليب؟[cite: 12]", options: ["الْيَوْمَ تَكُونُ مَعِي فِي الْفِرْدَوْسِ[cite: 12]", "سوف تذهب للملكوت[cite: 12]", "أنت مغفور لك[cite: 12]", "اصبر قليلاً[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "المسيحية هي ثورة داخلية، وفعل روحاني في عمق الإنسان يُسمى...[cite: 12]", options: ["الولادة الجديدة[cite: 12]", "تغيير المظهر[cite: 12]", "العمل الجماعي[cite: 12]", "النشاط الاجتماعي[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "لماذا تضع الكنيسة حجرة المعمودية في الجهة الغربية الشمالية؟[cite: 12]", options: ["لأن الطفل يترك الغرب (الظلمة) ويتجه للشرق (النور)[cite: 12]", "لأنها أسهل في البناء[cite: 12]", "لأن الشمس تشرق منها[cite: 12]", "لا يوجد سبب[cite: 12]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "ماذا تجحد الأم نيابة عن الطفل عند المعمودية؟[cite: 12]", options: ["الشيطان وأعماله[cite: 12]", "الحياة[cite: 12]", "الطعام[cite: 12]", "العمل[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "يُغطس الطفل في الماء ثلاث مرات على مثال...[cite: 12]", options: ["الثالوث القدوس[cite: 12]", "ثلاث سنوات[cite: 12]", "ثلاث تجارب[cite: 12]", "الصلبان الثلاثة[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "ماذا يلبس الطفل بعد المعمودية؟[cite: 12]", options: ["أبيض[cite: 12]", "أسود[cite: 12]", "أحمر[cite: 12]", "أزرق[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "كم رشماً يرشم الكاهن بالصليب لتقديس الحواس؟[cite: 12]", options: ["8 صلبان[cite: 12]", "12 صليباً[cite: 12]", "36 صليباً[cite: 12]", "5 صلبان[cite: 12]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "ما هو التقديس؟[cite: 12]", options: ["التخصيص والتكريس لله[cite: 12]", "التميز عن الآخرين[cite: 12]", "القوة الجسدية[cite: 12]", "الغنى المادي[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "الزنار الأحمر حول الطفل المعمد يرمز لـ...[cite: 12]", options: ["عهد مع المسيح بدمه[cite: 12]", "الخطر[cite: 12]", "الانتصار[cite: 12]", "الحرارة[cite: 12]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "ماذا يحدث حين نتناول من جسد الرب ودمه؟[cite: 12]", options: ["يثبت المسيح فينا ونحن فيه[cite: 12]", "نصير أغنياء[cite: 12]", "ننسى آلامنا[cite: 12]", "نصبح قديسين فوراً[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "الشهداء تحت المذبح أعطوا ثياباً بيضاً، علامة على...[cite: 12]", options: ["الطهارة والنقاوة[cite: 12]", "الغنى[cite: 12]", "المكانة العالية[cite: 12]", "القوة[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "يقول الكتاب: 'أما الصِّدِّيقُ فَوَائِقٌ عِنْدَ مَوْتِهِ' (أم 14: 32).[cite: 12]", options: ["صح[cite: 12]", "خطأ[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"},
            {q: "المعمودية تعيد تشكيل الإنسان للانتماء لـ...[cite: 12]", options: ["الله[cite: 12]", "البشر[cite: 12]", "العالم[cite: 12]", "الذات[cite: 12]"], answer: 0, difficulty: "متوسط", diffClass: "diff-medium"},
            {q: "الطفل الذي يتعمد يولد في بذرة...[cite: 12]", options: ["الإنسان الجديد[cite: 12]", "الإنسان القديم[cite: 12]", "الخوف[cite: 12]", "الضعف[cite: 12]"], answer: 0, difficulty: "صعب", diffClass: "diff-hard"},
            {q: "هدف التناول والعشرة مع الرب هو...[cite: 12]", options: ["النمو في العشرة معه[cite: 12]", "المجد الذاتي[cite: 12]", "المديح من الناس[cite: 12]", "الراحة الزمنية[cite: 12]"], answer: 0, difficulty: "سهل", diffClass: "diff-easy"}
        ];

        let currentQuestionIndex = 0, score = 0, firstAttempt = true;
        function startGame() { document.getElementById('start-screen').classList.remove('active'); document.getElementById('game-screen').classList.add('active'); currentQuestionIndex = 0; score = 0; loadQuestion(); }
        function loadQuestion() {
            firstAttempt = true;
            const q = questions[currentQuestionIndex];
            document.getElementById('progress-ribbon').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            const badge = document.getElementById('difficulty-badge'); badge.innerText = q.difficulty; badge.className = `difficulty-badge ${q.diffClass}`;
            document.getElementById('question-text').innerText = q.q;
            const optionsContainer = document.getElementById('options-container'); optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt; btn.onclick = () => checkAnswer(index, btn); optionsContainer.appendChild(btn);
            });
        }
        function checkAnswer(selectedIndex, button) {
            if (selectedIndex === questions[currentQuestionIndex].answer) {
                button.classList.add('correct');
                const allButtons = document.querySelectorAll('.option-btn'); allButtons.forEach(btn => btn.style.pointerEvents = 'none');
                if (firstAttempt) score++;
                showStarsEffect(button);
                document.body.classList.remove('warning');
                setTimeout(() => { currentQuestionIndex++; currentQuestionIndex < questions.length ? loadQuestion() : showResult(); }, 1500);
            } else {
                firstAttempt = false; button.classList.add('wrong'); button.style.pointerEvents = 'none';
                document.body.classList.add('warning'); setTimeout(() => document.body.classList.remove('warning'), 500);
            }
        }
        function showStarsEffect(button) {
            const rect = button.getBoundingClientRect();
            const x = rect.left + rect.width / 2; const y = rect.top + rect.height / 2;
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div'); star.className = 'star'; star.innerText = '✨';
                star.style.left = x + 'px'; star.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2; const distance = 80 + Math.random() * 50;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1000);
            }
        }
        function showResult() {
            document.getElementById('game-screen').classList.remove('active'); document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score').innerText = `النتيجة: ${score} من ${questions.length}`;
            let message = score === questions.length ? "ممتاز جداً! أنت ملم بكل تفاصيل هذا الدرس ببراعة." : (score >= 20 ? "رائع! أداء جميل جداً ومجهود مقدر." : "محاولة جيدة! نرجو مراجعة الدرس مرة أخرى.");
            document.getElementById('result-message').innerText = message;
            document.getElementById('result-emoji').innerText = score === questions.length ? "👑" : "🌟";
        }
        function resetGame() { document.getElementById('result-screen').classList.remove('active'); document.getElementById('start-screen').classList.add('active'); }
    </script>
</body>
</html>
