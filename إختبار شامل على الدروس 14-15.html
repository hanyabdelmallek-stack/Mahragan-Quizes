<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إختبار تفاعلي شامل على الدروس 14-15</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f7; display: flex; justify-content: center; padding: 20px; }
        #container { background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 15px; border: 4px solid #2980b9; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { color: #2980b9; text-align: center; }
        .q-box { margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .option { margin: 10px 0; padding: 15px; background: #ecf0f1; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .option:hover { background: #dcdde1; }
        .correct { background: #27ae60 !important; color: white; }
        .wrong { background: #c0392b !important; color: white; }
        #score-display { text-align: center; font-size: 1.8em; font-weight: bold; color: #2980b9; margin: 20px 0; }
        button { background: #2980b9; color: white; border: none; padding: 15px 30px; border-radius: 5px; font-size: 1.2em; cursor: pointer; display: block; margin: 20px auto; }
        button:hover { background: #2471a3; }
    </style>
</head>
<body>
<div id="container">
    <h1>إختبار تفاعلي شامل (الدروس 14-15)</h1>
    <p style="text-align:center; color:#7f8c8d;">قصة الفداء في التسبحة اليومية وفي القداس الإلهي</p>
    <div id="quiz-area"></div>
    <button onclick="calculateScore()">اعرض النتيجة</button>
    <div id="score-display"></div>
</div>

<script>
    const questions = [
        // أسئلة من الدرس 15 (التسبحة اليومية) - Source 26
        { q: "حسب مديح القيامة، ماذا نالت حواء عوض حزنها؟[cite: 26]", options: ["الزينة[cite: 26]", "الموت الأبدي[cite: 26]", "الطرد من الفردوس[cite: 26]", "النسيان[cite: 26]"], a: 0 },
        { q: "كيف كان رد فعل الجنود الملائكية عندما رأوا المخلص حسب مع الأموات؟[cite: 26]", options: ["هربوا بعيداً[cite: 26]", "بهتوا (اندهشوا)[cite: 26]", "لم يكترثوا[cite: 26]", "حزنوا ويئسوا[cite: 26]"], a: 1 },
        { q: "من هي التي وُصفت بأنها 'الكنز المختوم' الذي امتلأنا بالحياة من قبله؟[cite: 26]", options: ["حواء[cite: 26]", "والدة الإله (العذراء مريم)[cite: 26]", "الكنيسة[cite: 26]", "مدينة بيت لحم[cite: 26]"], a: 1 },
        { q: "في ثيؤطوكية يوم الاثنين، مَن هو 'آدم الثاني'؟[cite: 26]", options: ["نوح[cite: 26]", "يوسف النجار[cite: 26]", "السيد المسيح[cite: 26]", "إبراهيم[cite: 26]"], a: 2 },
        { q: "ما هي المدينة التي وُلد فيها آدم الثاني لكي يرد آدم الأول للفردوس؟[cite: 26]", options: ["الناصرة[cite: 26]", "أورشليم[cite: 26]", "بيت لحم[cite: 26]", "مصر[cite: 26]"], a: 2 },
        { q: "حسب لبش ثيؤطوكية الاثنين، بمشورة مَن أكل آدم من ثمرة الشجرة؟[cite: 26]", options: ["الحية فقط[cite: 26]", "مشورة حواء أمنا الأولى[cite: 26]", "بإرادته المنفردة[cite: 26]", "الشيطان مباشرة[cite: 26]"], a: 1 },
        { q: "ما الذي حلّ على جنسنا وكل الخليقة بسبب الأكل من الشجرة؟[cite: 26]", options: ["سلطان الموت والفساد[cite: 26]", "الجوع والعطش[cite: 26]", "الطوفان[cite: 26]", "البركة[cite: 26]"], a: 0 },
        { q: "في ثيؤطوكية الثلاثاء، مَن هي التي أرضعت عائل كل أحد؟[cite: 26]", options: ["السيدة العذراء[cite: 26]", "حواء[cite: 26]", "سارة[cite: 26]", "الكنيسة[cite: 26]"], a: 0 },
        { q: "بمَن ينطق الفردوس حسب ثيؤطوكية الأربعاء؟[cite: 26]", options: ["بالملائكة[cite: 26]", "بالمسيح الذي صار آدم الثاني[cite: 26]", "بالقديسين[cite: 26]", "بالأنبياء[cite: 26]"], a: 1 },
        { q: "ما هي شجرة الحياة التي استحققنا أن نأكل منها في العهد الجديد حسب ثيؤطوكية الخميس؟[cite: 26]", options: ["شجرة التين[cite: 26]", "المعرفة والعلوم[cite: 26]", "جسد الله ودمه الحقيقيين[cite: 26]", "المن السماوي[cite: 26]"], a: 2 },
        { q: "مَن التي من أجلها أُغلق باب الفردوس، ومن قِبل مَن فُتح مرة أخرى؟[cite: 26]", options: ["أغلق بسبب حواء، وفتح من قبل مريم العذراء[cite: 26]", "أغلق بسبب آدم، وفتح بسبب إبراهيم[cite: 26]", "أغلق بسبب الحية، وفتح بسبب الملائكة[cite: 26]", "لا شيء مما سبق[cite: 26]"], a: 0 },
        { q: "ابنة مَن هي مريم العذراء كما ورد في ثيؤطوكية الأحد؟[cite: 26]", options: ["ابنة داود[cite: 26]", "ابنة إبراهيم[cite: 26]", "ابنة يواقيم[cite: 26]", "ابنة يعقوب[cite: 26]"], a: 2 },
        { q: "ماذا تؤكد لنا الليتورجيات بشأن آدم وحواء؟[cite: 26]", options: ["أنهما مجرد رموز[cite: 26]", "حقيقة وجود وخلق شخصيتي آدم وحواء وسقوطهما[cite: 26]", "أنهما أساطير قديمة[cite: 26]", "أنهما لم يخطئا[cite: 26]"], a: 1 },
        { q: "كيف تُحسب الأيام في الشريعة اليهودية كما في مدة بقاء المسيح في القبر؟[cite: 26]", options: ["يحسب الجزء من اليوم يوماً كاملاً[cite: 26]", "يحسب اليوم بـ 24 ساعة دقيقة[cite: 26]", "تحسب الليالي فقط[cite: 26]", "لا تعترف الشريعة بأجزاء الأيام[cite: 26]"], a: 0 },
        { q: "كم عدد الظهورات المتعددة بعد القيامة التي سجلها العهد الجديد؟[cite: 26]", options: ["7 ظهورات[cite: 26]", "11 ظهوراً[cite: 26]", "12 ظهوراً[cite: 26]", "40 ظهوراً[cite: 26]"], a: 1 },
        { q: "لكم أخ ظهر الرب دفعة واحدة بعد قيامته؟[cite: 26]", options: ["12 أخاً[cite: 26]", "70 أخاً[cite: 26]", "أكثر من 500 أخ مرة واحدة[cite: 26]", "100 أخ[cite: 26]"], a: 2 },
        { q: "بماذا وعد الرجلان اللذان بلباس أبيض التلاميذ يوم الصعود؟[cite: 26]", options: ["أن المسيح لن يعود[cite: 26]", "أن يسوع هذا سيأتي هكذا كما رأيتموه منطلقاً[cite: 26]", "أنه سيرسل ملائكة بدلاً منه[cite: 26]", "أنه سيؤسس مملكة أرضية[cite: 26]"], a: 1 },
        { q: "ماذا نفعل وننتظر كل يوم في قانون الإيمان بناءً على قصة الفداء؟[cite: 26]", options: ["ننتظر الموت[cite: 26]", "ننتظر قيامة الأموات وحياة الدهر الآتي[cite: 26]", "ننتظر مجازاة الأشرار فقط[cite: 26]", "ننتظر انتهاء العالم بالماء[cite: 26]"], a: 1 },
        { q: "مَن هو الذي حمل بنفسه خطايانا في جسده على الخشبة؟[cite: 26]", options: ["الكهنة[cite: 26]", "الأنبياء[cite: 26]", "فداء الرب لنا على الصليب[cite: 26]", "رؤساء الملائكة[cite: 26]"], a: 2 },
        { q: "من خلال ثيؤطوكية الجمعة، بماذا رُد الإنسان مرة أخرى إلى الفردوس؟[cite: 26]", options: ["بالأعمال الصالحة[cite: 26]", "بالتوبة فقط[cite: 26]", "من قبل صليبه، وقيامته المقدسة[cite: 26]", "بكثرة الصلوات[cite: 26]"], a: 2 },

        // أسئلة من الدرس 14 (القداس الإلهي) - Source 27
        { q: "ما هي الصلوات الليتورجية والطقسية في كنيستنا القبطية الأرثوذكسية؟[cite: 27]", options: ["مجرد عادات قديمة[cite: 27]", "أناشيد غير مفهومة[cite: 27]", "عبارة عن تدوين لعقائدنا وإيماننا المسيحي[cite: 27]", "صلوات مأخوذة من العهد القديم فقط[cite: 27]"], a: 2 },
        { q: "كيف تصف أوشية الراقدين الموت بالنسبة لعبيد الله؟[cite: 27]", options: ["أنه نهاية الوجود[cite: 27]", "أنه لا يكون موت لعبيدك، بل هو انتقال[cite: 27]", "أنه عقاب أبدي[cite: 27]", "أنه نوم بلا استيقاظ[cite: 27]"], a: 1 },
        { q: "حسب أوشية الراقدين، مَن هو الطاهر من دنس؟[cite: 27]", options: ["الأنبياء والرسل[cite: 27]", "ليس أحداً طاهراً من دنس ولو كانت حياته يوماً واحداً على الأرض[cite: 27]", "الأطفال الصغار فقط[cite: 27]", "الملائكة الذين على الأرض[cite: 27]"], a: 1 },
        { q: "في صلاة الصلح بالقداس الباسيلي، كيف دخل الموت إلى العالم؟[cite: 27]", options: ["بحسد إبليس[cite: 27]", "بسبب الجهل[cite: 27]", "بقضاء من الله[cite: 27]", "بالصدفة[cite: 27]"], a: 0 },
        { q: "كيف هُدم الموت حسب القداس الباسيلي؟[cite: 27]", options: ["بالصلاة والصوم[cite: 27]", "بالظهور المحيي الذي لابنك الوحيد الجنس[cite: 27]", "بطوفان نوح[cite: 27]", "بالناموس[cite: 27]"], a: 1 },
        { q: "لماذا يصلي الكاهن بصيغة الجمع 'جبلنا وخلقنا ووضعنا في فردوس النعيم'؟[cite: 27]", options: ["للتفخيم والتعظيم[cite: 27]", "بمعنى أنه ومعه كل الشعب هم من سلالة آدم، فكل ما حدث لآدم حدث لهم[cite: 27]", "لأنه يتحدث عن الملائكة والبشر[cite: 27]", "لأنه خطأ مطبعي في الخولاجي[cite: 27]"], a: 1 },
        { q: "في القداس الغريغوري، مَن الذي ائتمنه الله على خلاصنا؟[cite: 27]", options: ["رئيس ملائكة[cite: 27]", "نبي عظيم[cite: 27]", "لا ملاك، ولا رئيس ملائكة ولا نبي.. بل أنت بغير استحالة تجسدت[cite: 27]", "إبراهيم أبو الآباء[cite: 27]"], a: 2 },
        { q: "في أي شيء شابهنا المسيح حسب صلاة الصلح في القداس الغريغوري؟[cite: 27]", options: ["في الخطيئة فقط[cite: 27]", "في المظهر فقط[cite: 27]", "شابهتنا في كل شيء، ما خلا الخطية وحدها[cite: 27]", "في الضعف والمرض الموروث[cite: 27]"], a: 2 },
        { q: "ماذا يصرخ الكاهن بالنيابة عن الشعب كله في القداس الغريغوري (قبل الرشومات)؟[cite: 27]", options: ["أنا اختطفت لي قضية (حكم) الموت[cite: 27]", "أنا بريء من الخطيئة[cite: 27]", "أنا تبت ورجعت[cite: 27]", "أنا لم أسمع الوصية[cite: 27]"], a: 0 },
        { q: "حسب صلاة الصلح في القداس الكيرلسي، مَن الذي يتزكى أمام الله؟[cite: 27]", options: ["كل مَن يصلي بانتظام[cite: 27]", "ليس مولود امرأة يتزكى أمامك[cite: 27]", "الأبرار من العهد القديم[cite: 27]", "الشهداء فقط[cite: 27]"], a: 1 },
        { q: "كيف نتعامل مع قصة الخلق المذكورة في سفر التكوين بناءً على صلوات الأجبية؟[cite: 27]", options: ["أنها قصة خيالية للعظة[cite: 27]", "أنها حقيقية ونأخذها بحرفيتها[cite: 27]", "أنها رمزية لا تمت للواقع بصلة[cite: 27]", "أنها تتحدث عن شعوب وليس أفراد[cite: 27]"], a: 1 },
        { q: "في قطع صلاة باكر، مِن ماذا خلّص المسيح أبانا آدم؟[cite: 27]", options: ["من العبودية في مصر[cite: 27]", "من الغواية[cite: 27]", "من المرض[cite: 27]", "من الجوع[cite: 27]"], a: 1 },
        { q: "في نفس صلاة باكر، مِن ماذا عتق المسيح أمنا حواء؟[cite: 27]", options: ["من طلقات الموت[cite: 27]", "من العمل الشاق[cite: 27]", "من أعدائها[cite: 27]", "من النسيان[cite: 27]"], a: 0 },
        { q: "في أي يوم وفي أي ساعة سُمر المسيح على الصليب حسب صلوات الأجبية؟[cite: 27]", options: ["في اليوم الثالث والساعة الثالثة[cite: 27]", "في اليوم السادس وفي الساعة السادسة[cite: 27]", "في اليوم الأول والساعة التاسعة[cite: 27]", "في اليوم السابع[cite: 27]"], a: 1 },
        { q: "لماذا سُمر المسيح على الصليب في اليوم السادس والساعة السادسة كما في الأجبية؟[cite: 27]", options: ["من أجل الخطية التي تجرأ عليها أبونا آدم في الفردوس[cite: 27]", "ليتمم النبوات الرومانية[cite: 27]", "لأنها ساعة الراحة[cite: 27]", "لأنه أخطأ في حق قيصر[cite: 27]"], a: 0 },
        { q: "ماذا نطلب من المسيح أن يمزقه في صلاة الساعة السادسة؟[cite: 27]", options: ["ملابسنا العتيقة[cite: 27]", "صك خطايانا[cite: 27]", "ستارة الهيكل[cite: 27]", "أعدائنا[cite: 27]"], a: 1 },
        { q: "في صلاة الساعة التاسعة، مَن الذي قَبِل الرب اعترافه على الصليب؟[cite: 27]", options: ["يوحنا الحبيب[cite: 27]", "قائد المئة[cite: 27]", "اللص على الصليب[cite: 27]", "بيلاطس البنطي[cite: 27]"], a: 2 },
        { q: "ماذا نقر ونعترف في صلاة الساعة التاسعة أسوة باللص؟[cite: 27]", options: ["نقر بخطايانا معترفين بألوهيتك[cite: 27]", "نقر بضعفنا البشري فقط[cite: 27]", "نعترف بخطايا غيرنا[cite: 27]", "نطلب النجاة من الموت الجسدي[cite: 27]"], a: 0 },
        { q: "كيف جُبل الإنسان في البداية حسب القداس الباسيلي؟[cite: 27]", options: ["على الفساد والموت[cite: 27]", "على غير فساد[cite: 27]", "ككائن روحي بلا جسد[cite: 27]", "كملاك مجنح[cite: 27]"], a: 1 },
        { q: "ما هي أرجاء المسكونة التي يصلي عنها الكاهن في أوشية الراقدين؟[cite: 27]", options: ["مصر فقط[cite: 27]", "من مشارق الشمس إلى مغاربها، ومن الشمال إلى الجنوب[cite: 27]", "أورشليم وما حولها[cite: 27]", "أديرة الرهبان فقط[cite: 27]"], a: 1 }
    ];

    const area = document.getElementById('quiz-area');
    questions.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'q-box';
        div.innerHTML = `<p>${idx + 1}. ${q.q}</p>`;
        q.options.forEach((opt, i) => {
            const o = document.createElement('div');
            o.className = 'option';
            o.innerText = opt;
            o.onclick = function() {
                this.parentElement.querySelectorAll('.option').forEach(el => el.style.background = '#ecf0f1');
                this.style.background = '#dcdde1';
                this.setAttribute('data-selected', i);
            };
            div.appendChild(o);
        });
        area.appendChild(div);
    });

    function calculateScore() {
        let score = 0;
        document.querySelectorAll('.q-box').forEach((box, i) => {
            const sel = box.querySelector('[data-selected]');
            if(sel) {
                if(parseInt(sel.getAttribute('data-selected')) === questions[i].a) {
                    sel.classList.add('correct'); score++;
                } else {
                    sel.classList.add('wrong');
                    box.querySelectorAll('.option')[questions[i].a].classList.add('correct');
                }
            }
        });
        document.getElementById('score-display').innerText = "النتيجة: " + score + " / " + questions.length;
    }
</script>
</body>
</html>
