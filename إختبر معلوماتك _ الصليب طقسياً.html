<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إختبر معلوماتك _ الصليب طقسياً</title>
    <style>
        /* التنسيقات الأساسية */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.5s;
            overflow-x: hidden;
        }

        /* شاشة التحذير الخفيف (الإجابة الخاطئة) */
        body.warning {
            background: linear-gradient(135deg, #ffe6e6 0%, #ffcccc 100%);
        }

        /* حاوية اللعبة */
        #game-container {
            background: white;
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
            text-align: center;
            border: 4px solid #4a90e2;
        }

        /* شاشة البداية والنهاية */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        p.subtitle {
            color: #7f8c8d;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        /* الأزرار الرئيسية */
        .btn-main {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-main:hover {
            transform: scale(1.05);
            background-color: #357abd;
        }

        /* شريط التقدم */
        #progress-ribbon {
            background-color: #f1c40f;
            color: #2c3e50;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* مستوى الصعوبة */
        .difficulty-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            color: white;
            font-size: 0.9em;
            margin-right: 15px;
            font-weight: bold;
        }
        .diff-easy { background-color: #2ecc71; }
        .diff-medium { background-color: #f39c12; }
        .diff-hard { background-color: #e74c3c; }

        /* منطقة السؤال */
        #question-text {
            font-size: 1.6em;
            color: #34495e;
            margin: 20px 0 30px;
            line-height: 1.5;
            font-weight: bold;
        }

        /* خيارات الإجابة */
        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 600px) {
            #options-container {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            color: #2c3e50;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }

        .option-btn:hover {
            background-color: #e0e6ed;
            border-color: #3498db;
            transform: translateY(-3px);
        }

        .option-btn.correct {
            background-color: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.6);
            transform: scale(1.05);
        }

        .option-btn.wrong {
            background-color: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* تأثير النجوم الساطعة */
        .star {
            position: absolute;
            font-size: 2em;
            pointer-events: none;
            animation: flyStar 1s ease-out forwards;
            z-index: 10;
        }

        @keyframes flyStar {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(2); }
        }

        /* النتيجة النهائية */
        .result-icon {
            font-size: 5em;
            margin-bottom: 10px;
        }
        #final-score {
            font-size: 2.5em;
            color: #d35400;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- شاشة البداية -->
        <div id="start-screen" class="screen active">
            <h1>إختبر معلوماتك _ الصليب طقسياً</h1>
            <p class="subtitle">استكشف العقائد المسيحية من خلال الطقس</p>
            <p style="font-size: 1.2em; color: #555; margin-bottom: 30px;">
                مرحباً بك! استعد لاختبار معلوماتك حول المعنى اللاهوتي والطقسي للصليب، وأعياده، واستخداماته في الكنيسة من خلال 30 سؤالاً مشوقاً.
            </p>
            <button class="btn-main" onclick="startGame()">▶️ ابدأ اللعب الآن</button>
        </div>

        <!-- شاشة الأسئلة -->
        <div id="game-screen" class="screen">
            <div>
                <span id="progress-ribbon">السؤال ١ من ٣٠</span>
                <span id="difficulty-badge" class="difficulty-badge">سهل</span>
            </div>
            
            <div id="question-text">نص السؤال يظهر هنا...</div>
            
            <div id="options-container">
                <!-- الأزرار ستُضاف هنا عن طريق الجافاسكريبت -->
            </div>
        </div>

        <!-- شاشة النتيجة -->
        <div id="result-screen" class="screen">
            <div class="result-icon" id="result-emoji">🏆</div>
            <h1>اكتملت المسابقة بنجاح!</h1>
            <div id="final-score">نتيجتك: 0 / 30</div>
            <p id="result-message" style="font-size: 1.3em; margin-bottom: 30px; color: #34495e;"></p>
            <button class="btn-main" onclick="resetGame()">🔄 العب مرة أخرى</button>
        </div>

    </div>

    <script>
        // بنك الأسئلة مبني حصرياً على النص المرفق
        const questions = [
            {
                q: "العلاقة بين الطقس والعقيدة في الكنيسة هي أن كل طقس له معنى لاهوتي وكل عقيدة لها معنى طقسي دقيق.[cite: 3]",
                options: ["صح", "خطأ"],
                answer: 0, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "الصليب في الطقس الكنسي يحوي في داخله كل...[cite: 3]",
                options: ["القصص التاريخية", "العقائد المسيحية العظمى", "الألحان فقط", "الكتب المقدسة"],
                answer: 1, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "بم نبدأ صلواتنا في الكنيسة؟[cite: 3]",
                options: ["بالألحان", "بقراءة الإنجيل", "بالصليب", "بالعظة"],
                answer: 2, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "أين يُستخدم الصليب في الخدمات الكنسية؟[cite: 3]",
                options: ["في سر المعمودية فقط", "في كل الأسرار وكل الصلوات", "في صلوات الأعياد فقط", "في القداس فقط"],
                answer: 1, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "في أعلى مبنى الكنيسة، أين يوضع الصليب؟[cite: 3]",
                options: ["على باب الكنيسة", "على منارة الكنيسة", "على النوافذ", "على السور الخارجي"],
                answer: 1, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "يعتبر شكل الصليب من أشكال بناء الكنائس.[cite: 3]",
                options: ["صح", "خطأ"],
                answer: 0, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "كيف نحمل الصليب بشكل شخصي كما ذُكر في الدرس؟[cite: 3]",
                options: ["نعلقه على صدورنا وندقه على أيدينا", "نخفيه في جيوبنا", "نحمله في حقائبنا", "نضعه في الكتب فقط"],
                answer: 0, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "ما هي وظيفة الصليب في يد الكهنة؟[cite: 3]",
                options: ["وسيلة للإشارة", "وسيلة للزينة", "وسيلة بركة", "وسيلة للقياس"],
                answer: 2, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "كم عيداً مخصصاً للصليب في الكنيسة (بالإضافة إلى أسبوع الآلام والجمعة العظيمة)؟[cite: 3]",
                options: ["عيد واحد", "عيدان", "ثلاثة أعياد", "أربعة أعياد"],
                answer: 1, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "متى يُحتفل بالعيد الأول للصليب؟[cite: 3]",
                options: ["١٧ توت", "١٠ برمهات", "١ مسرى", "٢٩ كيهك"],
                answer: 0, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "ماذا نتذكر في عيد الصليب الذي يوافق ١٧ توت؟[cite: 3]",
                options: ["اكتشاف الصليب المجيد", "تدشين كنيسة القيامة في أورشليم وتكريس الصليب", "ظهور الصليب لقسطنطين", "نقل جبل المقطم"],
                answer: 1, difficulty: "صعب", diffClass: "diff-hard"
            },
            {
                q: "أين تقع كنيسة القيامة التي تم تدشينها وتكريس الصليب فيها يوم ١٧ توت؟[cite: 3]",
                options: ["في روما", "في أورشليم", "في الإسكندرية", "في أنطاكية"],
                answer: 1, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "في أي يوم يُحتفل بالعيد الثاني (عيد اكتشاف الصليب المجيد)؟[cite: 3]",
                options: ["١٧ توت", "١٠ برمهات", "١ بؤونة", "٨ طوبة"],
                answer: 1, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "من هي الملكة البارة التي اكتشفت الصليب المجيد؟[cite: 3]",
                options: ["الملكة كليوباترا", "الملكة إستير", "الملكة هيلانة", "الملكة أستير"],
                answer: 2, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "في أي عام ميلادي تم اكتشاف الصليب المجيد على يد الملكة هيلانة؟[cite: 3]",
                options: ["سنة ٣١٨ م", "سنة ٣٢٦ م", "سنة ٣٣٣ م", "سنة ٤٥١ م"],
                answer: 1, difficulty: "صعب", diffClass: "diff-hard"
            },
            {
                q: "من النصوص الليتورجية التي تذكر الصليب كما جاء في الدرس:[cite: 3]",
                options: ["لحن نسجد لصليبك", "لحن إبؤورو", "لحن غولغوثا", "لحن أومونوجينيس"],
                answer: 0, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "أي من هذه العبارات تعتبر من النصوص الليتورجية للصليب؟[cite: 3]",
                options: ["السفينة الناجية", "الصخرة القوية", "الخشبة المحيية", "الشجرة المثمرة"],
                answer: 2, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "عبارة 'الصليب فخرنا' تعتبر من...[cite: 3]",
                options: ["الأسرار الكنسية", "النصوص الليتورجية", "أسماء الكنائس", "رتب الكهنوت"],
                answer: 1, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "ماذا نعلن في ذكصولوجية عيد الصليب؟[cite: 3]",
                options: ["إيماننا بالصليب كعلامة فداء ومصالحة مع الله", "حزننا الدائم", "انفصالنا عن العالم", "نهاية الزمان"],
                answer: 0, difficulty: "صعب", diffClass: "diff-hard"
            },
            {
                q: "في أي نص نقول: 'أعطى علامة لعبيده الذين يخافونه'؟[cite: 3]",
                options: ["ذكصولوجية عيد الصليب", "إبصالية يوم الجمعة", "لحن نسجد لصليبك", "قسمة القداس"],
                answer: 1, difficulty: "صعب", diffClass: "diff-hard"
            },
            {
                q: "كيف توصف هذه العلامة في إبصالية يوم الجمعة؟[cite: 3]",
                options: ["اسم الخلاص والصليب المحيى", "علامة العذاب المُر", "علامة النهاية", "رمز الضعف"],
                answer: 0, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "أين يوضع الصليب أثناء القداس الإلهي ليبارك الكاهن به الشعب؟[cite: 3]",
                options: ["على باب الكنيسة", "في الخورس", "على المذبح", "مع الشمامسة"],
                answer: 2, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "الهدف من وضع الصليب على المذبح أثناء القداس الإلهي هو للزينة فقط.[cite: 3]",
                options: ["صح", "خطأ"],
                answer: 1, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "ماذا نفعل على الطعام والشراب ليباركه الله؟[cite: 3]",
                options: ["نقرأ كتاباً", "نغسله بالماء", "نرشم الصليب", "نتركه قليلاً"],
                answer: 2, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "رشم الصليب في مواقف حياتنا يعتبر...[cite: 3]",
                options: ["عادة قديمة", "علامة قوة", "رمزاً للضعف", "أمراً غير ضروري"],
                answer: 1, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "تعيد الكنيسة للصليب في أسبوع الآلام والجمعة العظيمة بالإضافة إلى العيدين الأساسيين.[cite: 3]",
                options: ["صح", "خطأ"],
                answer: 0, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "بناء الكنائس على شكل صليب يعبر عن ارتباط...[cite: 3]",
                options: ["الطقس بالعقيدة اللاهوتية", "العمارة بالجماليات فقط", "السياسة بالدين", "لا شيء مما سبق"],
                answer: 0, difficulty: "صعب", diffClass: "diff-hard"
            },
            {
                q: "لا توجد عقيدة لاهوتية في الكنيسة إلا ولها معنى طقسي دقيق.[cite: 3]",
                options: ["صح", "خطأ"],
                answer: 0, difficulty: "سهل", diffClass: "diff-easy"
            },
            {
                q: "في الكنيسة، نبدأ صلواتنا ونختمها بدون استخدام الصليب.[cite: 3]",
                options: ["صح", "خطأ"],
                answer: 1, difficulty: "متوسط", diffClass: "diff-medium"
            },
            {
                q: "استخدام الصليب في الكنيسة يشمل...[cite: 3]",
                options: ["الأسرار والصلوات فقط", "المذبح فقط", "بناء الكنيسة فقط", "كل ما سبق"],
                answer: 3, difficulty: "متوسط", diffClass: "diff-medium"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let firstAttempt = true;

        // دالة بدء اللعبة
        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        // دالة تحميل السؤال
        function loadQuestion() {
            firstAttempt = true;
            const q = questions[currentQuestionIndex];
            
            // تحديث الشريط والصعوبة
            document.getElementById('progress-ribbon').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            
            const badge = document.getElementById('difficulty-badge');
            badge.innerText = q.difficulty;
            badge.className = `difficulty-badge ${q.diffClass}`;

            // نص السؤال
            document.getElementById('question-text').innerText = q.q;

            // توليد الأزرار
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            // تعديل تصميم أزرار (صح/خطأ) لتكون بجوار بعضها
            if (q.options.length === 2) {
                optionsContainer.style.gridTemplateColumns = '1fr 1fr';
            } else {
                optionsContainer.style.gridTemplateColumns = window.innerWidth > 600 ? '1fr 1fr' : '1fr';
            }
        }

        // دالة فحص الإجابة
        function checkAnswer(selectedIndex, button) {
            const q = questions[currentQuestionIndex];
            
            if (selectedIndex === q.answer) {
                // إجابة صحيحة
                button.classList.add('correct');
                
                // منع النقر على باقي الأزرار
                const allButtons = document.querySelectorAll('.option-btn');
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');

                if (firstAttempt) score++;
                
                showStarsEffect(button);
                document.body.classList.remove('warning');

                // الانتقال للسؤال التالي بعد تأخير
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        loadQuestion();
                    } else {
                        showResult();
                    }
                }, 1500);

            } else {
                // إجابة خاطئة
                firstAttempt = false;
                button.classList.add('wrong');
                button.style.pointerEvents = 'none'; // منع النقر على نفس الزر مرة أخرى
                // يبقى السؤال على الشاشة، وتظل الخيارات الأخرى متاحة للنقر
                
                // تأثير التحذير البصري (إضاءة حمراء خفيفة)
                document.body.classList.add('warning');
                setTimeout(() => document.body.classList.remove('warning'), 500);
            }
        }

        // تأثير النجوم المتطايرة
        function showStarsEffect(button) {
            const rect = button.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerText = '✨';
                star.style.left = x + 'px';
                star.style.top = y + 'px';
                
                // اتجاهات عشوائية للنجوم
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 50;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                document.body.appendChild(star);
                
                // إزالة النجمة بعد انتهاء الحركة
                setTimeout(() => star.remove(), 1000);
            }
        }

        // عرض النتيجة النهائية
        function showResult() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            document.getElementById('final-score').innerText = `النتيجة: ${score} من ${questions.length}`;
            
            let message = "";
            let emoji = "";
            
            if (score === questions.length) {
                message = "ممتاز جداً! أنت ملم بكل تفاصيل طقس الصليب في الكنيسة.";
                emoji = "👑";
            } else if (score >= 20) {
                message = "رائع! أداء جميل جداً ومجهود مقدر، استمر في المراجعة.";
                emoji = "🌟";
            } else {
                message = "محاولة جيدة! نرجو مراجعة الدرس مرة أخرى لتعميق فهمك لطقس الصليب.";
                emoji = "📖";
            }
            
            document.getElementById('result-message').innerText = message;
            document.getElementById('result-emoji').innerText = emoji;
        }

        // إعادة ضبط اللعبة
        function resetGame() {
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        }
    </script>
