<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الشامل - المستوى المتقدم</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background-color 0.5s; overflow-x: hidden; color: #333; }
        body.warning { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        #game-container { background: white; width: 95%; max-width: 900px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3); padding: 35px; position: relative; text-align: center; border: 4px solid #f1c40f; }
        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { color: #2c3e50; font-size: 2.4em; margin-bottom: 10px; line-height: 1.3; }
        p.subtitle { color: #7f8c8d; font-size: 1.2em; margin-bottom: 30px; }
        .btn-main { background-color: #f39c12; color: white; border: none; padding: 15px 40px; font-size: 1.5em; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4); transition: transform 0.2s, background-color 0.2s; font-weight: bold; }
        .btn-main:hover { transform: scale(1.05); background-color: #e67e22; }
        #progress-ribbon { background-color: #2ecc71; color: white; padding: 10px 20px; border-radius: 20px; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #question-text { font-size: 1.5em; color: #2c3e50; margin: 20px 0 30px; line-height: 1.6; font-weight: bold; }
        #options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { #options-container { grid-template-columns: 1fr; } }
        .option-btn { background-color: #f8f9fa; border: 2px solid #bdc3c7; padding: 18px; font-size: 1.15em; border-radius: 15px; cursor: pointer; transition: all 0.3s; color: #2c3e50; font-weight: bold; display: flex; align-items: center; justify-content: center; line-height: 1.4; text-align: right; }
        .option-btn:hover { background-color: #e0e6ed; border-color: #3498db; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .option-btn.correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transform: scale(1.05); z-index: 2; position: relative; }
        .option-btn.wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .star { position: absolute; font-size: 2em; pointer-events: none; animation: flyStar 1s ease-out forwards; z-index: 10; }
        @keyframes flyStar { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(2); } }
        #final-score { font-size: 3em; color: #e67e22; font-weight: bold; margin: 20px 0; }
        .option-letter { margin-left: 10px; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="screen active">
            <h1>الاختبار الشامل - المستوى المتقدم</h1>
            <p class="subtitle">يَعْظُمُ انْتِصَارُنَا بِالَّذِي أَحَبَّنَا (رو 37:8)</p>
            <p style="font-size: 1.2em; color: #555; margin-bottom: 30px;">١٠٠ سؤال متقدم تتحدى فهمك اللاهوتي العميق لقصة الفداء والمحبة في طقوس وعقائد الكنيسة.</p>
            <button class="btn-main" onclick="startGame()">▶️ ابدأ التحدي المتقدم</button>
        </div>
        <div id="game-screen" class="screen">
            <div>
                <span id="progress-ribbon">السؤال ١</span>
            </div>
            <div id="question-text"></div>
            <div id="options-container"></div>
        </div>
        <div id="result-screen" class="screen">
            <div class="result-icon" id="result-emoji">🏆</div>
            <h1>اكتمل التحدي المتقدم!</h1>
            <div id="final-score"></div>
            <p id="result-message" style="font-size: 1.3em; margin-bottom: 30px; color: #34495e;"></p>
            <button class="btn-main" onclick="resetGame()">🔄 إعادة الاختبار</button>
        </div>
    </div>

    <script>
        const questions = [
            // 1-25: القداس الإلهي (صعب ومتقدم)
            {q: "لماذا يُعتبر صيغة الجمع في صلاة 'قدوس قدوس' دليلاً لاهوتياً مهماً؟[cite: 13]", options: ["لأنها تُظهر قوة الكهنوت", "لأن الشعب يشارك الكاهن في اللحن", "لأن الكاهن وكل الشعب هم من سلالة آدم، فما حدث له حدث لهم", "لتأكيد أهمية التسبحة الجماعية"], answer: 2},
            {q: "في القداس الغريغوري، ماذا يقصد الكاهن بقوله: 'أنا اختطفت لي قضية الموت'؟[cite: 13]", options: ["أنه تحدى الموت بقوته الشخصية", "أنه ينوب عن الشعب كله في اعترافه باستحقاق حكم الموت", "أنه هزم الموت نيابة عن المسيح", "أنه يرفض الموت كحقيقة واقعة"], answer: 1},
            {q: "كيف يربط القداس الباسيلي بين خلق الإنسان والفساد؟[cite: 13]", options: ["يقرر أن الله جبل الإنسان قابلاً للفساد بطبيعته", "يؤكد أن الله جبل الإنسان على غير فساد، ولكن الموت دخل بحسد إبليس", "يعتبر الفساد مرحلة تطورية ضرورية", "يتجاهل الفساد ويركز على القيامة فقط"], answer: 1},
            {q: "في صلاة الصلح للقداس الكيرلسي، بماذا نصف المعرفة الإلهية لضعفنا؟[cite: 13]", options: ["أنه لا يهتم بضعفنا البشري", "أنه يديننا على كل هفوة صغيرة", "لأنك العارف كخالق جبلتنا أنه ليس مولود امرأة يتزكى أمامك", "أنه يطلب منا الكمال المطلق دون نعمة"], answer: 2},
            {q: "كيف تصف صلاة باكر دور المسيح تجاه حواء تحديداً؟[cite: 13]", options: ["عتقتها من طلقات الموت", "أعطاها الناموس الجديد", "جعلها أم الأحياء مجدداً", "غفر لها خطيئتها فقط"], answer: 0},
            {q: "الصلوات الليتورجية في الكنيسة هي مجرد نصوص أدبية تاريخية ولا تُعتبر تدويناً للعقيدة.[cite: 13]", options: ["صواب", "خطأ"], answer: 1},
            {q: "في صلاة الساعة السادسة، ما هو الرابط اللاهوتي بين الصليب وخطيئة الفردوس؟[cite: 13]", options: ["أن الصليب حدث في مكان الفردوس", "أن الصليب كان من خشب شجرة المعرفة", "أن المسيح سُمر في اليوم السادس والساعة السادسة من أجل خطية آدم في الفردوس", "أن آدم هو من صلب المسيح رمزياً"], answer: 2},
            {q: "ما هو الشرط الذي وضعه القداس الغريغوري لتجسد الابن بقوله 'بغير...'؟[cite: 13]", options: ["بغير ألم", "بغير استحالة", "بغير خطية", "بغير جسد"], answer: 1},
            {q: "في صلاة الساعة التاسعة، الاعتراف مع اللص يمثل إقراراً بـ...[cite: 13]", options: ["استحقاقنا لحكم الموت مع الاعتراف بألوهية المسيح", "براءتنا من خطية آدم", "ظلم اليهود للمسيح", "قوة الإرادة البشرية"], answer: 0},
            {q: "أي القداسات يركز بشكل صريح ومطول على أن الله لم يأتمن ملاكاً أو نبياً على خلاصنا بل تجسد بنفسه؟[cite: 13]", options: ["القداس الباسيلي", "القداس الغريغوري", "القداس الكيرلسي", "القداس المرقسي"], answer: 1},
            {q: "أوشية الراقدين تقرر أنه 'ليس أحد طاهراً من دنس ولو كانت حياته يوماً واحداً على الأرض'.[cite: 13]", options: ["صواب", "خطأ"], answer: 0},
            {q: "في صلاة باكر، يُعطى المسيح لقب 'النور الحقيقي الذي يضيء لـ...'.[cite: 13]", options: ["لكل إنسان آتٍ إلى العالم", "للمؤمنين فقط", "للقديسين فقط", "لليهود والأمم معاً"], answer: 0},
            {q: "في القداس الغريغوري، الكلمات 'المساوي، والجليس، والخالق، الشريك مع الآب' تؤكد عقيدة...[cite: 13]", options: ["تأله الإنسان", "التثليث والتوحيد وألوهية الابن", "وحدانية الطبيعة فقط", "انفصال الأقانيم"], answer: 1},
            {q: "تصف صلاة الصلح الكيرلسية الفكر البشري الخاطئ بأنه 'فكر غاش مملوء من شر...'.[cite: 13]", options: ["الشيطان", "العالم", "الخائن", "الجسد"], answer: 2},
            {q: "أي الصلوات تربط بين تمزيق 'صك خطايانا' والصلب؟[cite: 13]", options: ["صلاة باكر", "صلاة الساعة الثالثة", "صلاة الساعة السادسة", "صلاة النوم"], answer: 2},
            {q: "بحسب الليتورجيا، التجسد يعني أن المسيح أخذ طبيعتنا البشرية لكنه لم يشابهنا في الألم.[cite: 13]", options: ["صواب", "خطأ"], answer: 1},
            {q: "كيف تصف صلاة باكر رد فعل الخليقة تجاه مجيء المسيح؟[cite: 13]", options: ["كل الخليقة حزنت لصلبه", "كل الخليقة تهللت بمجيئك", "كل الخليقة صمتت", "كل الخليقة ارتعدت"], answer: 1},
            {q: "لماذا يُذكر السقوط بشكل متكرر قبل الحديث عن الفداء في صلوات الصلح؟[cite: 13]", options: ["لإبراز عظمة المحبة والفداء الذي رمم هذا السقوط", "لإدانة آدم وحواء باستمرار", "لأنها قصة تاريخية يجب سردها", "لإخافة المؤمنين من الدينونة"], answer: 0},
            {q: "القداس الباسيلي يوجه صلاة الصلح للآب، بينما القداس الغريغوري يوجهها للابن.[cite: 13]", options: ["صواب", "خطأ"], answer: 0},
            {q: "العبارة 'العارف كخالق جبلتنا' تدل على أن رحمة الله مبنية على...[cite: 13]", options: ["تجاهله لأخطائنا", "أعمالنا الصالحة", "معرفته العميقة بضعف طبيعتنا التي خلقها", "شفاعة الملائكة فقط"], answer: 2},
            {q: "في قطع صلاة باكر، ما هي العطية التي ننالها نتيجة التجسد والفداء ونسبح الله عليها؟[cite: 13]", options: ["روح النبوة", "روح البنوة", "المعرفة المطلقة", "السيادة على الأرض"], answer: 1},
            {q: "في القداس الغريغوري، الله أراد أن يجدد الإنسان ويرده إلى...[cite: 13]", options: ["رتبته الأولى", "طبيعة ملائكية", "حالة روحية بلا جسد", "الفناء"], answer: 0},
            {q: "حكم الموت في الليتورجيا يُنظر إليه كقضية عادلة استوجبها الإنسان بخطيئته، لكن المسيح حملها.[cite: 13]", options: ["صواب", "خطأ"], answer: 0},
            {q: "القداس الغريغوري يقرر أن المسيح صار لنا... لدى الآب.[cite: 13]", options: ["دياناً", "محامياً", "وسيطاً", "رقيباً"], answer: 2},
            {q: "صلاة باكر تؤكد أن قصة الخلق في سفر التكوين هي أسطورة لتبسيط الفهم.[cite: 13]", options: ["صواب", "خطأ"], answer: 1},

            // 26-50: التسبحة اليومية (صعب ومتقدم)
            {q: "في ثيؤطوكية الاثنين، وُصف الموضع الذي كثرت فيه الخطية بأنه...[cite: 14]", options: ["صار ملعوناً للأبد", "تفاضلت فيه نعمة المسيح", "احترق بنار العدل", "نُسي من ذاكرة الله"], answer: 1},
            {q: "بناءً على التسبحة، ما هو الأثر المزدوج لتجسد المسيح من العذراء بالنسبة لحواء؟[cite: 14]", options: ["أعادها للتراب ومنحها الراحة", "أعطاها الناموس وحررها من آدم", "نالت الزينة عوض حزنها وأخذت الحرية", "جعلها مساوية للملائكة"], answer: 2},
            {q: "في ثيؤطوكية الأربعاء، يُشار إلى المسيح بـ 'آدم الثاني' من أجل...[cite: 14]", options: ["آدم الإنسان الأول", "خلاص الملائكة", "إكمال النبوة فقط", "إظهار قدرته"], answer: 0},
            {q: "في ثيؤطوكية الخميس، كيف ارتبطت شجرة المعرفة بشجرة الحياة؟[cite: 14]", options: ["بالمخالفة أكلت المرأة من الشجرة، ومن قبل مريم استحققنا شجرة الحياة (الجسد والدم)", "الشجرتان هما نفس الشجرة تاريخياً", "شجرة الحياة أُخفيت ولم تُعلن بعد", "شجرة المعرفة تحولت إلى شجرة الحياة بالصليب"], answer: 0},
            {q: "في مديح القيامة، يُطلب من المؤمنين أن يمجدوا العذراء كـ...[cite: 14]", options: ["أم النور", "كنز القيامة", "باب السماء", "رجاء المسكونة"], answer: 1},
            {q: "ثيؤطوكية السبت تشير إلى أن الخلاص أدرك جنسنا من قبل 'ثمرتك' (أي المسيح).[cite: 14]", options: ["صواب", "خطأ"], answer: 0},
            {q: "ما هو اللقب الممنوح للفردوس في ثيؤطوكية الأربعاء لارتباطه بالمسيح؟[cite: 14]", options: ["الفردوس المفقود", "الفردوس الأرضي", "الفردوس الناطق", "الفردوس السماوي"], answer: 2},
            {q: "في لبش الاثنين، يُنسب مجيء سلطان الموت والفساد على جنسنا إلى...[cite: 14]", options: ["غضب الله المباشر", "مشورة حواء وأكل آدم من الثمرة", "خطية قايين", "سقوط إبليس فقط"], answer: 1},
            {q: "في الشريعة اليهودية، الجزء من اليوم يحسب يوماً كاملاً، مما يفسر بقاء المسيح 3 أيام في القبر.[cite: 14]", options: ["صواب", "خطأ"], answer: 0},
            {q: "بحسب سجلات العهد الجديد המذكورة، كم مرة ظهر المسيح للمجدلية وحدها أو مع مريم الأخرى؟[cite: 14]", options: ["مرة واحدة", "مرتين (للمجدلية والأخرى، ثم للمجدلية وحدها)", "ثلاث مرات", "لم يظهر لها أبداً"], answer: 1},
            {q: "أي ظهور من ظهورات المسيح حدث لأكبر عدد من الأشخاص في وقت واحد؟[cite: 14]", options: ["ظهوره لتلاميذ عمواس", "الظهور على بحيرة طبرية", "ظهوره لأكثر من 500 أخ", "ظهوره يوم الصعود"], answer: 2},
            {q: "في ثيؤطوكية الأحد، ماذا عرفنا من قبل مريم ابنة يواقيم؟[cite: 14]", options: ["شريعة موسى", "الذبيحة الحقيقية لمغفرة الخطايا", "أسرار الفردوس", "علامات المجيء الثاني"], answer: 1},
            {q: "يؤكد العهد الجديد أن المسيح ارتفع وهم ينظرون، وأخذته سحابة عن أعينهم بحسب سفر...[cite: 14]", options: ["أعمال الرسل", "رؤيا يوحنا", "إنجيل يوحنا", "رسالة رومية"], answer: 0},
            {q: "ظهور المسيح لمعلمنا يعقوب مسجل في...[cite: 14]", options: ["إنجيل متى", "إنجيل مرقس", "إنجيل لوقا", "رسالة كورنثوس الأولى 15"], answer: 3},
            {q: "لبش ثيؤطوكية السبت يخاطب العذراء قائلاً: 'افرحي يا رجاء خلاص كل المسكونة لأننا من أجل ابنك عتقنا من...'.[cite: 14]", options: ["نير الرومان", "لعنة حواء", "عبودية فرعون", "حكم الناموس"], answer: 1},
            {q: "في مديح القيامة، يُقال عن المسيح: 'أقمت آدم معك وأعتقته من...'.[cite: 14]", options: ["الخطية", "التراب", "الجحيم", "الألم"], answer: 2},
            {q: "تعبير 'أخذت الحرية دفعة أخرى من أجلك' في مديح القيامة يشير إلى التحرر من قبضة الموت الأبدي.[cite: 14]", options: ["صواب", "خطأ"], answer: 0},
            {q: "في ثيؤطوكية الاثنين، سر الرب أن يرد آدم إلى رئاسته بينما هو...[cite: 14]", options: ["خائف يرتعد", "حزين القلب", "متمرد عاصٍ", "جاهل بالحق"], answer: 1},
            {q: "الثيؤطوكيات تركز حصرياً على العذراء مريم ولا تتطرق إلى قصة الخلاص والفداء.[cite: 14]", options: ["صواب", "خطأ"], answer: 1},
            {q: "وفقاً لرسالة كورنثوس (2 كو 5: 21)، 'جعل الذي لم يعرف خطية، خطية لأجلنا لنصير نحن...'.[cite: 14]", options: ["أبراراً بالناموس", "بر الله فيه", "ملائكة في السماء", "معصومين من الخطأ"], answer: 1},
            {q: "في أي ظهور سجل العهد الجديد قول الملاكين: 'سياتي هكذا كما رأيتموه منطلقاً'؟[cite: 14]", options: ["عند التجلي", "عند القيامة", "عند الصعود", "يوم الخمسين"], answer: 2},
            {q: "حسب مديح القيامة، العذراء هي 'الكنز المختوم' الذي امتلأنا بـ... من قبله.[cite: 14]", options: ["الحياة", "المعرفة", "النور", "القوة"], answer: 0},
            {q: "في ثيؤطوكية الثلاثاء، تُدعى العذراء بالتي 'أعطت الخلاص لآدم وحواء' والتي 'أرضعت...'.[cite: 14]", options: ["عائل كل أحد", "الكلمة المتجسد", "الطفل الإلهي", "ابن الله"], answer: 0},
            {q: "المسيح حمل خطايانا في جسده على الخشبة، وهي آية مقتبسة من رسالة بطرس الأولى.[cite: 14]", options: ["صواب", "خطأ"], answer: 0},
            {q: "في قانون الإيمان، نهتف منتظرين 'قيامة الأموات وحياة الدهر الآتي' كجزء من إيماننا بالفداء.[cite: 14]", options: ["صواب", "خطأ"], answer: 0},

            // 51-75: محبة الله (صعب ومتقدم)
            {q: "وفقاً لسفر التثنية، ما هي المعضلة اللاهوتية إذا أحببنا الله من 'كل القلب' وكيف نُحب الآخرين؟[cite: 15]", options: ["لا يجب أن نحب الآخرين أبداً", "نحبهم من داخل محبتنا لله كجزء منها", "نعطيهم جزءاً من العقل وليس القلب", "نحبهم في أيام العطلات فقط"], answer: 1},

            {q: "ماذا يعني أن الله 'أبرع جمالاً من بني البشر' روحياً؟[cite: 15]", options: ["أنه يمتلك شكلاً بشرياً جميلاً فقط", "أن بهاء قداسته وصفاته يفوق كل مشتهيات الدنيا", "أنه يزين السماء بالنجوم", "أنه يخلق بشراً جميلين"], answer: 1},

            {q: "وفقاً للنص، إذا وقعت في ضيقة واحتجت الله، فإن ذلك قد يكون وسيلة ليقودك إلى محبته.[cite: 15]", options: ["صواب", "خطأ"], answer: 0},

            // 76-100: محبة الناس (صعب ومتقدم)
            {q: "متى تعتبر محبة النفس روحية ومطلوبة؟[cite: 16]", options: ["عندما نسعى لراحتها الجسدية دائماً", "عندما نوجهها للقداسة والنقاوة لتكون هيكلاً للروح القدس", "عندما نفضلها على الآخرين", "محبة النفس غير مطلوبة إطلاقاً"], answer: 1},

            {q: "الأساس اللاهوتي لمحبة كل البشر هو أننا...[cite: 16]", options: ["نعيش على كوكب واحد", "من أب واحد وأم واحدة (رابطة الدم)", "نمتلك نفس القدرات العقلية", "نخضع لنفس القوانين الطبيعية"], answer: 1},
            {q: "عدم الحب بين البشر يعتبر...[cite: 16]", options: ["تطوراً طبيعياً للمجتمع", "أمراً غير طبيعي لا يتفق مع مشيئة الله", "عقاباً إلهياً حتمياً", "وسيلة للبقاء للأقوى"], answer: 1},
            {q: "أول حادثة إيذاء في الكتاب المقدس تبرز غياب المحبة كانت بين...[cite: 16]", options: ["آدم وحواء", "إبليس وحواء", "قايين وهابيل", "الإنسان والوحوش"], answer: 2},
            {q: "ما هو العنصر السلبي المطلوب لترميم بناء المحبة المنهدم بين البشر؟[cite: 16]", options: ["تبادل الهدايا", "الكف عن الكراهية والاعتداء", "تجاهل الآخرين تماماً", "الصوم الانقطاعي"], answer: 1},
            {q: "الكراهية تعتبر المشاعر الكامنة، بينما... هو التعبير الظاهر عنها.[cite: 16]", options: ["الابتعاد", "الحزن", "الاعتداء", "الصمت"], answer: 2},
            {q: "لماذا يُعتبر تدليل الأم لابنها وتغطية أخطائه محبة غير حقيقية؟[cite: 16]", options: ["لأنه يفسده ولا يهتم بصالحه الحقيقي وأبديته", "لأنه يكلفها الكثير من المال", "لأنه يغضب الأب فقط", "لأنه يخالف قوانين المجتمع"], answer: 0},
            {q: "المحبة الحقيقية تقتضي أن تجامل صديقك في أخطائه لئلا تجرح شعوره.[cite: 16]", options: ["صواب", "خطأ"], answer: 1},
            {q: "قمة المحبة الباذلة تجاه الآخرين تتجلى في...[cite: 16]", options: ["إعطائهم من الفائض", "بذل الذات والاستعداد للتضحية من أجلهم", "الابتسام في وجوههم", "الدعاء لهم في السر فقط"], answer: 1},
            {q: "كيف كانت محبة أكيلا وبريسكلا لبولس الرسول عملية وباذلة؟[cite: 16]", options: ["دفعا عنه الضرائب", "وضعا عنقيهما من أجل حياته", "استضافاه يوماً واحداً", "كتبا رسائله نيابة عنه"], answer: 1},
            {q: "المحبة التي تهدف لإشباع شهوة على حساب عفة الآخر وأبديته هي محبة غير طاهرة وأنانيّة.[cite: 16]", options: ["صواب", "خطأ"], answer: 0},
            {q: "تحيز يعقوب ليوسف أظهر أن المحبة غير العادلة تؤدي إلى...[cite: 16]", options: ["نجاح المفضل", "الحسد والضيقات والصراعات", "بناء شخصية قوية", "احترام الإخوة لأبيهم"], answer: 1},
            {q: "ماذا تعني 'المحبة بلا رياء' في المعاملات؟[cite: 16]", options: ["المحبة الصادقة الخالية من التظاهر والمصالح", "المحبة التي تُعلن أمام الناس فقط", "المحبة المبنية على العاطفة المؤقتة", "المحبة التي تطلب مقابلاً"], answer: 0},
            {q: "يوحنا الرسول يصف من يبغض أخاه بأنه...[cite: 16]", options: ["جاهل", "قاتل نفس", "غير مؤمن", "معزول"], answer: 1},
            {q: "الانتقام للنفس يتعارض مع المحبة لأنه...[cite: 16]", options: ["يستغرق وقتاً طويلاً", "يدخل في محبة الذات ولون من العداوة للغير", "غير قانوني", "يظهر الضعف"], answer: 1},
            {q: "إضافة الغرباء تعتبر درجة عالية من المحبة، وقد استضاف بها أناس ملائكة وهم لا يدرون (كإبراهيم).[cite: 16]", options: ["صواب", "خطأ"], answer: 0},
            {q: "أعلى قمم المحبة التي أوصى بها المسيح هي...[cite: 16]", options: ["محبة الأقرباء", "محبة الأصدقاء", "محبة الأعداء", "محبة الذات"], answer: 2},
            {q: "إذا وجدت صعوبة بالغة في محبة عدوك، فما هو الحد الأدنى المطلوب روحياً بحسب المادة؟[cite: 16]", options: ["أن تنتقم منه سراً", "على الأقل لا تبغضه، واغفر له في قلبك وانس إساءته", "أن تقاطعه تماماً وتتحدث عنه بالسوء", "أن تطلب من الله أن يعاقبه"], answer: 1},
            {q: "المحبة العملية تتطلب العمل والحق، ولا تكتفي بالكلام واللسان.[cite: 16]", options: ["صواب", "خطأ"], answer: 0},
            {q: "مثال 'راعوث' يبرز المحبة العملية في الحياة الاجتماعية من خلال...[cite: 16]", options: ["رفضها ترك حماتها واستعدادها للالتصاق بشعبها وإلهها", "عملها في الحقل لجمع المال لنفسها", "زواجها من بوعز", "عودتها لبلدها موآب"], answer: 0},
            {q: "القلب الذي تسكنه البغضة لا يسكنه الله، لأن الله محبة.[cite: 16]", options: ["صواب", "خطأ"], answer: 0},
            {q: "مبدأ 'المكافأة الملتزمة بالحق والموضوعية' هو من شروط المحبة...[cite: 16]", options: ["العاطفية", "العادلة (غير المتحيزة)", "الخيالية", "المشروطة"], answer: 1},
            {q: "الفرح بسقوط العدو هو خطية تتعارض مع طبيعة المحبة المسيحية النقية.[cite: 16]", options: ["صواب", "خطأ"], answer: 0},
            {q: "المحبة الروحانية تسعى باستمرار لـ... من تحبه.[cite: 16]", options: ["أبدية وخلاص نفس", "نجاحه المادي فقط", "شهرة", "راحته الجسدية المفرطة"], answer: 0}
        ];

        let currentQuestionIndex = 0, score = 0, firstAttempt = true;
        const alphabet = ['أ', 'ب', 'ج', 'د'];
        
        function startGame() { 
            document.getElementById('start-screen').classList.remove('active'); 
            document.getElementById('game-screen').classList.add('active'); 
            currentQuestionIndex = 0; 
            score = 0; 
            loadQuestion(); 
        }

        function loadQuestion() {
            firstAttempt = true;
            const q = questions[currentQuestionIndex];
            
            document.getElementById('progress-ribbon').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsContainer = document.getElementById('options-container'); 
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button'); 
                btn.className = 'option-btn'; 
                
                const letterSpan = document.createElement('span');
                letterSpan.className = 'option-letter';
                letterSpan.innerText = `(${alphabet[index]})`;
                
                const textSpan = document.createElement('span');
                textSpan.innerText = ` ${opt}`;

                btn.appendChild(letterSpan);
                btn.appendChild(textSpan);

                btn.onclick = () => checkAnswer(index, btn); 
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, button) {
            const currentQ = questions[currentQuestionIndex];
            if (selectedIndex === currentQ.answer) {
                button.classList.add('correct');
                const allButtons = document.querySelectorAll('.option-btn'); 
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');
                
                if (firstAttempt) score++;
                showStarsEffect(button);
                document.body.classList.remove('warning');
                
                setTimeout(() => { 
                    currentQuestionIndex++; 
                    if(currentQuestionIndex < questions.length) {
                        loadQuestion();
                    } else {
                        showResult();
                    }
                }, 1300);
            } else {
                firstAttempt = false; 
                button.classList.add('wrong'); 
                button.style.pointerEvents = 'none';
                document.body.classList.add('warning'); 
                setTimeout(() => document.body.classList.remove('warning'), 400);
            }
        }

        function showStarsEffect(button) {
            const rect = button.getBoundingClientRect();
            const x = rect.left + rect.width / 2; 
            const y = rect.top + rect.height / 2;
            
            for (let i = 0; i < 10; i++) {
                const star = document.createElement('div'); 
                star.className = 'star'; 
                star.innerText = '✨';
                star.style.left = x + 'px'; 
                star.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2; 
                const distance = 90 + Math.random() * 60;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1000);
            }
        }

        function showResult() {
            document.getElementById('game-screen').classList.remove('active'); 
            document.getElementById('result-screen').classList.add('active');
            
            document.getElementById('final-score').innerText = `النتيجة: ${score} من ${questions.length}`;
            
            let message = "";
            let emoji = "";
            if (score === questions.length) {
                message = "استثنائي حقاً! لقد برهنت على فهم لاهوتي وروحي عميق جداً بلا أي أخطاء.";
                emoji = "👑";
            } else if (score >= questions.length * 0.80) {
                message = "أداء متقدم ورائع! استيعابك للتفاصيل الدقيقة والعميقة مبهر جداً.";
                emoji = "🌟";
            } else {
                message = "اختبار صعب ومتقدم، محاولتك مقدرة ولكن يُنصح بالتأمل في الشروحات اللاهوتية بعمق أكبر.";
                emoji = "📖";
            }
            
            document.getElementById('result-message').innerText = message;
            document.getElementById('result-emoji').innerText = emoji;
        }

        function resetGame() { 
            document.getElementById('result-screen').classList.remove('active'); 
            document.getElementById('start-screen').classList.add('active'); 
        }
    </script>
