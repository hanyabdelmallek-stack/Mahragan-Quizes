<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الصليب - المراجعة الشاملة المتقدمة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .quiz-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .question-header {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #e9ecef;
            border: 2px solid transparent;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            color: #333;
            line-height: 1.4;
        }
        .option-btn:hover:not(:disabled) {
            background: #dee2e6;
        }
        .option-btn.correct {
            background: #d1e7dd !important;
            border-color: #198754 !important;
            color: #0f5132 !important;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #842029 !important;
        }
        .option-btn:disabled {
            cursor: default;
        }
        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .next-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .next-btn:hover:not(:disabled) {
            background: #0b5ed7;
        }
        .next-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .progress {
            font-size: 14px;
            color: #6c757d;
        }
        .results {
            text-align: center;
            display: none;
        }
        .results h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .score-percentage {
            font-size: 54px;
            font-weight: bold;
            color: #0d6efd;
            margin: 15px 0;
        }
        .results p {
            font-size: 18px;
            margin-bottom: 10px;
            color: #495057;
        }
        .correct-text {
            color: #198754;
            font-weight: bold;
        }
        .incorrect-text {
            color: #dc3545;
            font-weight: bold;
        }
        .restart-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .restart-btn:hover {
            background: #157347;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-block">
        <h1>مسابقة الصليب المتقدمة (100 سؤال)</h1>
        <div class="question-header" id="question">جاري تحميل السؤال...</div>
        <div class="options-container" id="options"></div>
        <div class="controls">
            <button class="next-btn" id="next-btn" disabled>السؤال التالي</button>
            <span class="progress" id="progress">سؤال 1 / 100</span>
        </div>
    </div>
    
    <div class="results" id="results-block">
        <h2>اكتمل الاختبار!</h2>
        <div class="score-percentage" id="score-percentage">0%</div>
        <p>الإجابات الصحيحة: <span class="correct-text" id="correct-count">0</span> من 100</p>
        <p>الإجابات الخاطئة: <span class="incorrect-text" id="incorrect-count">0</span> من 100</p>
        <button class="restart-btn" onclick="startQuiz()">إعادة الاختبار</button>
    </div>
</div>

    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnsweredCurrent = false;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const progressEl = document.getElementById('progress');
    const quizBlock = document.getElementById('quiz-block');
    const resultsBlock = document.getElementById('results-block');

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizBlock.style.display = 'block';
        resultsBlock.style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        hasAnsweredCurrent = false;
        nextBtn.disabled = true;
        
        const currentData = questionsData[currentQuestionIndex];
        questionEl.textContent = currentData.q;
        progressEl.textContent = `سؤال ${currentQuestionIndex + 1} / ${questionsData.length}`;
        
        optionsEl.innerHTML = '';
        currentData.options.forEach(optionText => {
            const btn = document.createElement('button');
            btn.textContent = optionText;
            btn.className = 'option-btn';
            btn.onclick = () => selectOption(btn, optionText, currentData.a);
            optionsEl.appendChild(btn);
        });
    }

    function selectOption(btn, selectedText, correctText) {
        // منع النقر المتعدد
        if (hasAnsweredCurrent) return;
        hasAnsweredCurrent = true;

        const allButtons = optionsEl.querySelectorAll('.option-btn');
        
        // تعطيل الأزرار بعد الاختيار
        allButtons.forEach(b => b.disabled = true);

        if (selectedText === correctText) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('incorrect');
            // إظهار الإجابة الصحيحة باللون الأخضر
            allButtons.forEach(b => {
                if (b.textContent === correctText) {
                    b.classList.add('correct');
                }
            });
        }
        
        nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
        if (hasAnsweredCurrent) {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questionsData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }
    };

    function showResults() {
        quizBlock.style.display = 'none';
        resultsBlock.style.display = 'block';
        
        const totalQuestions = questionsData.length;
        const incorrectCount = totalQuestions - score;
        const percentage = Math.round((score / totalQuestions) * 100);
        
        document.getElementById('score-percentage').textContent = `${percentage}%`;
        document.getElementById('correct-count').textContent = score;
        document.getElementById('incorrect-count').textContent = incorrectCount;
    }

    // بدء الاختبار
    startQuiz();
</script>

</body>
</html>
