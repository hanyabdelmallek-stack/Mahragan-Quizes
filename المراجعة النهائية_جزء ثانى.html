        { q: "في أي حالة تحدث التخلية لمن يحمل الصليب بحسب أثناسيوس؟", o: ["عندما يرتكب خطية صغيرة دون قصد وتهاون في تقديم التوبة الفورية", "لا تحصل تخلية إطلاقاً إلا للذي ضعفت أمانته وإيمانه بقوة الصليب", "عندما ينسى رشم الصليب قبل النوم أو قبل تناول الوجبات اليومية المعتادة", "عندما يواجه المؤمن شياطين من رتب عليا جداً تفوق قوة احتماله البشري"], a: "لا تحصل تخلية إطلاقاً إلا للذي ضعفت أمانته وإيمانه بقوة الصليب" },

        { q: "بماذا شبّه يوحنا ذهبي الفم علامة الصليب في حياة المؤمن؟", o: ["وسيلة سرية للتعرف على المسيحيين في الطرقات أثناء عصور الاضطهاد", "ينبوع الشجاعة والبركات الذي يجب أن نلبسه ونفتخر به كتاج فخري عظيم", "علامة للحداد والحزن المستمر على الخطايا التي اقترفناها في الماضي", "رمزاً سياسياً واجتماعياً يعبر عن الانتصار على الإمبراطورية الرومانية"], a: "ينبوع الشجاعة والبركات الذي يجب أن نلبسه ونفتخر به كتاج فخري عظيم" },
        { q: "كيف نواجه هجوم الشياطين على الجبناء بحسب الأنبا أنطونيوس؟", o: ["نواجههم بتقديم الصدقات والهبات للفقراء لكي يرضى الله عنا ويحمينا", "يجب تحصين النفس بعلامة الصليب بشجاعة ليرتدوا خائبين ويسخروا من ذواتهم", "نواجهها باللجوء للأطباء النفسيين لأنها خيالات ناتجة عن الخوف المستمر", "نواجههم بترتيل المزامير بصوت جماعي مرتفع لاستدعاء الملائكة الحارسة"], a: "يجب تحصين النفس بعلامة الصليب بشجاعة ليرتدوا خائبين ويسخروا من ذواتهم" },
        { q: "كيف أثبت كيرلس الأورشليمي قوة الصليب مستعيناً بالعهد القديم؟", o: ["بمقارنته بعصا موسى التي شقت البحر الأحمر وأغرقت جيوش فرعون الجبارة", "بمقارنته بالحية النحاسية فكم بالأحرى صليب رب المجد الذي يسكب الحياة", "بمقارنته بفلك نوح الذي أنقذ البشرية من الغرق في طوفان المياه المهلك", "بمقارنته بتابوت العهد الذي أسقط أسوار أريحا المنيعة بفضل أبواق الكهنة"], a: "بمقارنته بالحية النحاسية فكم بالأحرى صليب رب المجد الذي يسكب الحياة" },
        { q: "لماذا نطلب قوة الصليب قبل شفاعة القديسين كيرلس الأورشليمي؟", o: ["لأن القديسين قد ينشغلون عن طلباتنا الروحية والمادية في بعض الأوقات", "لأنه علامة ابن الإنسان ورسم تجسده وعليه قدم نفسه ذبيحة لله الآب", "لأن الصليب كان موجوداً كرمز قبل خلق القديسين والملائكة في السماء", "لأن شفاعة القديسين تقتصر على الأمور الروحية ولا تشمل الشفاء الجسدي"], a: "لأنه علامة ابن الإنسان ورسم تجسده وعليه قدم نفسه ذبيحة لله الآب" },
        { q: "ما تأثير إشارة الصليب على ممارسات السحر بحسب أنطونيوس؟", o: ["تحولها لبركات وتنجح مقاصدها الخفية إذا استخدمت بنية حسنة وروحانية", "تضعف السحر وتتلاشى قوة العرافة تماماً وتُبطل كل أعمال الأرواح الشريرة", "تتصارع معها وتحتاج لصلوات إضافية وصوم انقطاعي لتبطل فاعليتها بالكامل", "تجعلها تهاجر إلى أماكن أخرى نائية لا يوجد فيها مسيحيون يمارسون إيمانهم"], a: "تضعف السحر وتتلاشى قوة العرافة تماماً وتُبطل كل أعمال الأرواح الشريرة" },
        { q: "كيف أفحم الأنبا أنطونيوس فلاسفة الهراطقة عملياً أمامهم؟", o: ["بدعوتهم لمناظرة لاهوتية حول طبيعة المسيح مستخدماً الحجج المنطقية البحتة", "تحداهم أن يطهروا المعذبين بسحرهم ولما عجزوا رشمهم بالصليب فشفوا فوراً", "بأمره للشياطين أن تتحدث بلسان الفلاسفة لتفضح خداعهم أمام جميع الحاضرين", "بدعوتهم لبناء مذبح وتقديم ذبائح لله الحقيقي لينزل ناراً من السماء فجأة"], a: "تحداهم أن يطهروا المعذبين بسحرهم ولما عجزوا رشمهم بالصليب فشفوا فوراً" },
        { q: "كيف تبدأ الشياطين هجومها على الرهبان بحسب القديس أثناسيوس؟", o: ["بالظهور في أشكال مرعبة ومخيفة لترهيبهم وإبعادهم عن قلاليهم ونسكهم", "بالتجربة ووضع الصعاب لعرقلة طريقهم ومحاولة نفث الأفكار الشريرة الخفية", "بإحداث أمراض جسدية مزمنة تمنعهم من الصلاة والوقوف لساعات طويلة", "بتسليط الحكام الرومان وجنودهم لتعذيبهم وقتلهم لتخويف باقي المؤمنين"], a: "بالتجربة ووضع الصعاب لعرقلة طريقهم ومحاولة نفث الأفكار الشريرة الخفية" },
        { q: "ما الوسيلة الفعالة لردع هجمات الشياطين الفكرية والإغراءات؟", o: ["الدخول معها في حوار منطقي لإقناعها بالرحيل وعدم العودة مرة أخرى", "يرتد هجومها خائباً بالصلاة والصوم وتحصين النفس بعلامة الصليب القوية", "تجاهلها تماماً والنوم لساعات أطول للتخلص من التعب الفكري والإرهاق", "قراءة الفلسفات القديمة لمعرفة طرق ردعها وتطبيق التمارين العقلية الحديثة"], a: "يرتد هجومها خائباً بالصلاة والصوم وتحصين النفس بعلامة الصليب القوية" },
        { q: "ماذا نفعل إذا مدحتنا الشياطين ودعتنا بالبركة كأنطونيوس؟", o: ["نفرح لأن نسكنا أثمر وأخاف الشياطين وجعلها تعترف ببرنا وقداستنا حقاً", "لا نصغي إليها بل نرشم أنفسنا وبيوتنا بالصليب ونصلي فتتبدد هذه الخيالات", "نطلب منها إعلان أسرار المستقبل وما سيحدث لنا من أمجاد في السماء", "نخبر الإخوة بمديح الشياطين كشهادة لتقوانا وحسن عبادتنا لله القدوس"], a: "لا نصغي إليها بل نرشم أنفسنا وبيوتنا بالصليب ونصلي فتتبدد هذه الخيالات" },
        { q: "ما السبب اللاهوتي الذي يجعل الشياطين تخشى علامة الصليب؟", o: ["لأنها تذكرهم بنار جهنم التي أُعدت لهم ولأتباعهم في نهاية الزمان", "لأن الرب جردها بالحق وأشهرها جهاراً ظافراً بها على خشبة الصليب", "لأن خشب الصليب يمتلك خصائص طرد الأرواح بطبيعته المادية والكيميائية", "لأن الملائكة تقف دائماً بأسيوف نارية عند كل إشارة صليب تُرسَم بخشوع"], a: "لأن الرب جردها بالحق وأشهرها جهاراً ظافراً بها على خشبة الصليب" },
        { q: "في أي الأوقات والمناسبات يجب أن نرشم الصليب كمار أفرام؟", o: ["عند الدخول للكنيسة وفي أوقات الخطر الشديد فقط لطلب الحماية العاجلة", "في كل مناسبة الدخول والخروج والجلوس والقيام والنوم وفي العمل أيضاً", "عند مواجهة الهراطقة والسحرة حصراً لإثبات قوة الإيمان المسيحي لهم", "في الأعياد الكبرى وأوقات التناول من الأسرار المقدسة في الهيكل فقط"], a: "في كل مناسبة الدخول والخروج والجلوس والقيام والنوم وفي العمل أيضاً" },
        { q: "كيف يصف الأنبا أنطونيوس طبيعة الشياطين عند مواجهتها للصليب؟", o: ["أنها كائنات ماكرة تعرف كيف تتخفى وتستغل نقاط الضعف البشرية بذكاء", "أنها في غاية الجبن وتخشى جداً علامة صليب الرب وتنقشع بها كالدخان", "أنها قوية ومثابرة ولا تستسلم بسهولة بل تعاود الهجوم مرات عديدة متتالية", "أنها كائنات مادية تتأثر بالحرارة والبرودة ويمكن طردها بالبخور القوي"], a: "أنها في غاية الجبن وتخشى جداً علامة صليب الرب وتنقشع بها كالدخان" }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    const qTitle = document.getElementById('q-title');
    const optContainer = document.getElementById('opt-container');
    const nextBtn = document.getElementById('next-btn');
    const counter = document.getElementById('counter');
    const scoreSpan = document.getElementById('score');
    const quizScreen = document.getElementById('quiz-screen');
    const results = document.getElementById('results');
    const finalResult = document.getElementById('final-result');

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadQuestion() {
        answered = false;
        nextBtn.disabled = true;
        const q = questions[currentIdx];

        counter.innerText = `سؤال ${currentIdx + 1} / 100`;
        qTitle.innerText = q.q;
        optContainer.innerHTML = '';

        let opts = [...q.o];
        shuffle(opts);

        opts.forEach(optionText => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = optionText;
            btn.onclick = () => checkAnswer(btn, optionText, q.a);
            optContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedText, correctText) {
        if (answered) return;
        answered = true;

        const allOptions = optContainer.querySelectorAll('.option');
        allOptions.forEach(btn => btn.disabled = true);

        if (selectedText === correctText) {
            selectedBtn.classList.add('correct');
            score++;
            scoreSpan.innerText = score;
        } else {
            selectedBtn.classList.add('incorrect');
            allOptions.forEach(btn => {
                if (btn.innerText === correctText) {
                    btn.classList.add('correct');
                }
            });
        }
        nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
        if (!answered) return;
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            quizScreen.style.display = 'none';
            results.style.display = 'block';
            finalResult.innerText = `${score} / 100`;
        }
    };

    loadQuestion();
</script>
